
<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and Title -->
  <rect width="800" height="700" fill="#f9f9f9"/>
  <text x="400" y="40" font-size="24" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">3D-кубическая модель музыкальной структуры</text>
  <text x="400" y="70" font-size="16" text-anchor="middle" font-family="Arial, sans-serif">Трёхмерное представление тоновых отношений</text>
  
  <!-- Define transformation parameters for isometric view -->
  <!-- Main 3D cube structure -->
  <g transform="translate(400, 350)">
    <!-- Cube Framework - Constructing a 3D representation of the structure -->
    
    <!-- Front vertical plane -->
    <polygon points="-180,-180 180,-180 180,180 -180,180" fill="none" stroke="#ccc" stroke-width="1" opacity="0.3"/>
    
    <!-- Back vertical plane -->
    <polygon points="-120,-240 240,-240 240,120 -120,120" fill="none" stroke="#ccc" stroke-width="1" opacity="0.3"/>
    
    <!-- Bottom horizontal plane -->
    <polygon points="-180,180 180,180 240,120 -120,120" fill="none" stroke="#ccc" stroke-width="1" opacity="0.3"/>
    
    <!-- Top horizontal plane -->
    <polygon points="-180,-180 180,-180 240,-240 -120,-240" fill="none" stroke="#ccc" stroke-width="1" opacity="0.3"/>
    
    <!-- Left vertical plane -->
    <polygon points="-180,-180 -180,180 -120,120 -120,-240" fill="none" stroke="#ccc" stroke-width="1" opacity="0.3"/>
    
    <!-- Right vertical plane -->
    <polygon points="180,-180 180,180 240,120 240,-240" fill="none" stroke="#ccc" stroke-width="1" opacity="0.3"/>
    
    <!-- 3D Grid Lines - X axis (representing Whole Tone relationships) -->
    <line x1="-180" y1="-120" x2="180" y2="-120" stroke="#ccc" stroke-width="0.5" opacity="0.5"/>
    <line x1="-180" y1="-60" x2="180" y2="-60" stroke="#ccc" stroke-width="0.5" opacity="0.5"/>
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#ccc" stroke-width="0.5" opacity="0.5"/>
    <line x1="-180" y1="60" x2="180" y2="60" stroke="#ccc" stroke-width="0.5" opacity="0.5"/>
    <line x1="-180" y1="120" x2="180" y2="120" stroke="#ccc" stroke-width="0.5" opacity="0.5"/>
    
    <!-- 3D Grid Lines - Y axis (representing Perfect Fourth relationships) -->
    <line x1="-120" y1="-180" x2="-120" y2="180" stroke="#ccc" stroke-width="0.5" opacity="0.5"/>
    <line x1="-60" y1="-180" x2="-60" y2="180" stroke="#ccc" stroke-width="0.5" opacity="0.5"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#ccc" stroke-width="0.5" opacity="0.5"/>
    <line x1="60" y1="-180" x2="60" y2="180" stroke="#ccc" stroke-width="0.5" opacity="0.5"/>
    <line x1="120" y1="-180" x2="120" y2="180" stroke="#ccc" stroke-width="0.5" opacity="0.5"/>
    
    <!-- Coordinate Axes -->
    <line x1="0" y1="0" x2="220" y2="0" stroke="#F44336" stroke-width="2.5"/>
    <text x="230" y="10" font-size="14" text-anchor="start" font-family="Arial, sans-serif" fill="#F44336" font-weight="bold">X (Целые тоны)</text>
    
    <line x1="0" y1="0" x2="0" y2="200" stroke="#4CAF50" stroke-width="2.5"/>
    <text x="5" y="210" font-size="14" text-anchor="start" font-family="Arial, sans-serif" fill="#4CAF50" font-weight="bold">Y (Кварты)</text>
    
    <line x1="0" y1="0" x2="80" y2="-80" stroke="#2196F3" stroke-width="2.5"/>
    <text x="85" y="-85" font-size="14" text-anchor="start" font-family="Arial, sans-serif" fill="#2196F3" font-weight="bold">Z (Высота)</text>
    
    <!-- 3D Nodes representing notes of the structure -->
    
    <!-- Row 1: B1 Db2 Eb2 -->
    <g>
      <line x1="-120" y1="160" x2="-60" y2="160" stroke="#e6194B" stroke-width="3"/>
      <line x1="-60" y1="160" x2="0" y2="160" stroke="#e6194B" stroke-width="3"/>
      
      <circle cx="-120" cy="160" r="10" fill="#e6194B" stroke="#000"/>
      <text x="-120" y="160" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">B1</text>
      
      <circle cx="-60" cy="160" r="10" fill="#e6194B" stroke="#000"/>
      <text x="-60" y="160" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Db2</text>
      
      <circle cx="0" cy="160" r="10" fill="#e6194B" stroke="#000"/>
      <text x="0" y="160" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Eb2</text>
    </g>
    
    <!-- Row 2: E2 Gb2 Ab2 -->
    <g>
      <line x1="-120" y1="100" x2="-60" y2="100" stroke="#3cb44b" stroke-width="3"/>
      <line x1="-60" y1="100" x2="0" y2="100" stroke="#3cb44b" stroke-width="3"/>
      
      <circle cx="-120" cy="100" r="10" fill="#3cb44b" stroke="#000"/>
      <text x="-120" y="100" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">E2</text>
      
      <circle cx="-60" cy="100" r="10" fill="#3cb44b" stroke="#000"/>
      <text x="-60" y="100" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Gb2</text>
      
      <circle cx="0" cy="100" r="10" fill="#3cb44b" stroke="#000"/>
      <text x="0" y="100" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Ab2</text>
    </g>
    
    <!-- Row 3: A2 B2 Db3 -->
    <g>
      <line x1="-120" y1="40" x2="-60" y2="40" stroke="#ffe119" stroke-width="3"/>
      <line x1="-60" y1="40" x2="0" y2="40" stroke="#ffe119" stroke-width="3"/>
      
      <circle cx="-120" cy="40" r="10" fill="#ffe119" stroke="#000"/>
      <text x="-120" y="40" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">A2</text>
      
      <circle cx="-60" cy="40" r="10" fill="#ffe119" stroke="#000"/>
      <text x="-60" y="40" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">B2</text>
      
      <circle cx="0" cy="40" r="10" fill="#ffe119" stroke="#000"/>
      <text x="0" y="40" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">Db3</text>
    </g>
    
    <!-- Row 4: D3 E3 Gb3 -->
    <g>
      <line x1="-120" y1="-20" x2="-60" y2="-20" stroke="#4363d8" stroke-width="3"/>
      <line x1="-60" y1="-20" x2="0" y2="-20" stroke="#4363d8" stroke-width="3"/>
      
      <circle cx="-120" cy="-20" r="10" fill="#4363d8" stroke="#000"/>
      <text x="-120" y="-20" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">D3</text>
      
      <circle cx="-60" cy="-20" r="10" fill="#4363d8" stroke="#000"/>
      <text x="-60" y="-20" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">E3</text>
      
      <circle cx="0" cy="-20" r="10" fill="#4363d8" stroke="#000"/>
      <text x="0" y="-20" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Gb3</text>
    </g>
    
    <!-- Row 5: G3 A3 B3 -->
    <g>
      <line x1="-60" y1="-80" x2="0" y2="-80" stroke="#f58231" stroke-width="3"/>
      <line x1="0" y1="-80" x2="60" y2="-80" stroke="#f58231" stroke-width="3"/>
      
      <circle cx="-60" cy="-80" r="10" fill="#f58231" stroke="#000"/>
      <text x="-60" y="-80" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">G3</text>
      
      <circle cx="0" cy="-80" r="10" fill="#f58231" stroke="#000"/>
      <text x="0" y="-80" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">A3</text>
      
      <circle cx="60" cy="-80" r="10" fill="#f58231" stroke="#000"/>
      <text x="60" y="-80" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">B3</text>
    </g>
    
    <!-- Row 6: C4 D4 E4 -->
    <g>
      <line x1="0" y1="-140" x2="60" y2="-140" stroke="#911eb4" stroke-width="3"/>
      <line x1="60" y1="-140" x2="120" y2="-140" stroke="#911eb4" stroke-width="3"/>
      
      <circle cx="0" cy="-140" r="10" fill="#911eb4" stroke="#000"/>
      <text x="0" y="-140" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">C4</text>
      
      <circle cx="60" cy="-140" r="10" fill="#911eb4" stroke="#000"/>
      <text x="60" y="-140" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">D4</text>
      
      <circle cx="120" cy="-140" r="10" fill="#911eb4" stroke="#000"/>
      <text x="120" y="-140" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">E4</text>
    </g>
    
    <!-- Row 7: F4 G4 A4 -->
    <g>
      <line x1="60" y1="-80" x2="120" y2="-80" stroke="#42d4f4" stroke-width="3"/>
      <line x1="120" y1="-80" x2="180" y2="-80" stroke="#42d4f4" stroke-width="3"/>
      
      <circle cx="60" cy="-80" r="10" fill="#42d4f4" stroke="#000"/>
      <text x="60" y="-80" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">F4</text>
      
      <circle cx="120" cy="-80" r="10" fill="#42d4f4" stroke="#000"/>
      <text x="120" y="-80" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">G4</text>
      
      <circle cx="180" cy="-80" r="10" fill="#42d4f4" stroke="#000"/>
      <text x="180" y="-80" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">A4</text>
    </g>
    
    <!-- Row 8: Bb4 C5 D5 -->
    <g>
      <line x1="60" y1="-20" x2="120" y2="-20" stroke="#f032e6" stroke-width="3"/>
      <line x1="120" y1="-20" x2="180" y2="-20" stroke="#f032e6" stroke-width="3"/>
      
      <circle cx="60" cy="-20" r="10" fill="#f032e6" stroke="#000"/>
      <text x="60" y="-20" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Bb4</text>
      
      <circle cx="120" cy="-20" r="10" fill="#f032e6" stroke="#000"/>
      <text x="120" y="-20" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">C5</text>
      
      <circle cx="180" cy="-20" r="10" fill="#f032e6" stroke="#000"/>
      <text x="180" y="-20" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">D5</text>
    </g>
    
    <!-- Row 9: Eb5 F5 G5 -->
    <g>
      <line x1="60" y1="40" x2="120" y2="40" stroke="#a9a9a9" stroke-width="3"/>
      <line x1="120" y1="40" x2="180" y2="40" stroke="#a9a9a9" stroke-width="3"/>
      
      <circle cx="60" cy="40" r="10" fill="#a9a9a9" stroke="#000"/>
      <text x="60" y="40" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Eb5</text>
      
      <circle cx="120" cy="40" r="10" fill="#a9a9a9" stroke="#000"/>
      <text x="120" y="40" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">F5</text>
      
      <circle cx="180" cy="40" r="10" fill="#a9a9a9" stroke="#000"/>
      <text x="180" y="40" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">G5</text>
    </g>
    
    <!-- Row 10: Ab5 Bb5 C6 -->
    <g>
      <line x1="60" y1="100" x2="120" y2="100" stroke="#469990" stroke-width="3"/>
      <line x1="120" y1="100" x2="180" y2="100" stroke="#469990" stroke-width="3"/>
      
      <circle cx="60" cy="100" r="10" fill="#469990" stroke="#000"/>
      <text x="60" y="100" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Ab5</text>
      
      <circle cx="120" cy="100" r="10" fill="#469990" stroke="#000"/>
      <text x="120" y="100" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Bb5</text>
      
      <circle cx="180" cy="100" r="10" fill="#469990" stroke="#000"/>
      <text x="180" y="100" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">C6</text>
    </g>
    
    <!-- Row 11: Db6 Eb6 F6 -->
    <g>
      <line x1="60" y1="160" x2="120" y2="160" stroke="#e6beff" stroke-width="3"/>
      <line x1="120" y1="160" x2="180" y2="160" stroke="#e6beff" stroke-width="3"/>
      
      <circle cx="60" cy="160" r="10" fill="#e6beff" stroke="#000"/>
      <text x="60" y="160" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">Db6</text>
      
      <circle cx="120" cy="160" r="10" fill="#e6beff" stroke="#000"/>
      <text x="120" y="160" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">Eb6</text>
      
      <circle cx="180" cy="160" r="10" fill="#e6beff" stroke="#000"/>
      <text x="180" y="160" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">F6</text>
    </g>
    
    <!-- Vertical connections showing Perfect Fourth relationships -->
    <g stroke="#5b9bd5" stroke-width="1.5" stroke-dasharray="4" opacity="0.8">
      <!-- B1 to E2 -->
      <line x1="-120" y1="160" x2="-120" y2="100"/>
      
      <!-- E2 to A2 -->
      <line x1="-120" y1="100" x2="-120" y2="40"/>
      
      <!-- A2 to D3 -->
      <line x1="-120" y1="40" x2="-120" y2="-20"/>
      
      <!-- Repeat for other vertical connections... -->
    </g>
    
    <!-- 3D perspective lines to show the Z-axis height (pitch) -->
    <g stroke="#2196F3" stroke-width="0.8" stroke-dasharray="2" opacity="0.6">
      <!-- Connect nodes across the Z-axis to show pitch height -->
      <line x1="-120" y1="160" x2="-100" y2="140"/>
      <line x1="-60" y1="160" x2="-40" y2="140"/>
      <line x1="0" y1="160" x2="20" y2="140"/>
      
      <line x1="-120" y1="100" x2="-100" y2="80"/>
      <line x1="-60" y1="100" x2="-40" y2="80"/>
      <line x1="0" y1="100" x2="20" y2="80"/>
      
      <!-- More Z-axis connections... -->
    </g>
  </g>
  
  <!-- Legend -->
  <g transform="translate(400, 620)">
    <rect x="-360" y="-20" width="720" height="80" rx="5" fill="#f0f0f0" stroke="#333" stroke-width="1"/>
    
    <line x1="-340" y1="0" x2="-300" y2="0" stroke="#F44336" stroke-width="2.5"/>
    <text x="-290" y="5" font-size="14" text-anchor="start" font-family="Arial, sans-serif">Ось X: Целотоновые отношения (интервал 2 полутона)</text>
    
    <line x1="-340" y1="25" x2="-300" y2="25" stroke="#4CAF50" stroke-width="2.5"/>
    <text x="-290" y="30" font-size="14" text-anchor="start" font-family="Arial, sans-serif">Ось Y: Квартовые отношения (интервал 5 полутонов)</text>
    
    <line x1="20" y1="0" x2="60" y2="0" stroke="#2196F3" stroke-width="2.5"/>
    <text x="70" y="5" font-size="14" text-anchor="start" font-family="Arial, sans-serif">Ось Z: Высота тона (подъем по октавам)</text>
    
    <line x1="20" y1="25" x2="60" y2="25" stroke="#000" stroke-width="3"/>
    <text x="70" y="30" font-size="14" text-anchor="start" font-family="Arial, sans-serif">Цветные линии: 12 трезвучий (строк структуры)</text>
  </g>
</svg>
