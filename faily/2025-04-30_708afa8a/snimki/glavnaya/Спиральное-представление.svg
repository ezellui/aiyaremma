    <text x="320" y="340" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Ab5</text>
    
    <circle cx="340" cy="320" r="12" fill="#469990" stroke="black"/>
    <text x="340" y="320" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Bb5</text>
    
    <circle cx="360" cy="300" r="12" fill="#469990" stroke="black"/>
    <text x="360" y="300" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">C6</text>
    
    <!-- Whole tone connection -->
    <path d="M 320,340 Q 330,330 340,320 Q 350,310 360,300" stroke="#469990" stroke-width="2" fill="none"/>
    
    <!-- Perfect fourth connection -->
    <path d="M 320,390 Q 320,365 320,340" stroke="#555" stroke-width="1.5" stroke-dasharray="4" fill="none"/>
    
    <!-- Row 11: Db6 Eb6 F6 -->
    <circle cx="345" cy="290" r="12" fill="#e6beff" stroke="black"/>
    <text x="345" y="290" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">Db6</text>
    
    <circle cx="365" cy="270" r="12" fill="#e6beff" stroke="black"/>
    <text x="365" y="270" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">Eb6</text>
    
    <circle cx="385" cy="250" r="12" fill="#e6beff" stroke="black"/>
    <text x="385" y="250" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">F6</text>
    
    <!-- Whole tone connection -->
    <path d="M 345,290 Q 355,280 365,270 Q 375,260 385,250" stroke="#e6beff" stroke-width="2" fill="none"/>
    
    <!-- Perfect fourth connection -->
    <path d="M 360,300 Q 352,295 345,290" stroke="#555" stroke-width="1.5" stroke-dasharray="4" fill="none"/>
    
    <!-- Row 12: Gb6 Ab6 Bb6 -->
