
<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background and Title -->
  <rect width="800" height="800" fill="#f9f9f9"/>
  <text x="400" y="40" font-size="24" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Спиральное представление музыкальной структуры</text>
  <text x="400" y="70" font-size="16" text-anchor="middle" font-family="Arial, sans-serif">Показывает подъем по высоте и цикличность отношений</text>
  
  <!-- Center point -->
  <circle cx="400" cy="400" r="3" fill="#333"/>
  
  <!-- Spiral Grid -->
  <g stroke="#ddd" stroke-width="0.5" fill="none">
    <!-- Concentric circles -->
    <circle cx="400" cy="400" r="50"/>
    <circle cx="400" cy="400" r="100"/>
    <circle cx="400" cy="400" r="150"/>
    <circle cx="400" cy="400" r="200"/>
    <circle cx="400" cy="400" r="250"/>
    <circle cx="400" cy="400" r="300"/>
    <circle cx="400" cy="400" r="350"/>
    
    <!-- Radial lines -->
    <line x1="400" y1="400" x2="400" y2="50"/>
    <line x1="400" y1="400" x2="750" y2="400"/>
    <line x1="400" y1="400" x2="400" y2="750"/>
    <line x1="400" y1="400" x2="50" y2="400"/>
    <line x1="400" y1="400" x2="682" y2="118"/>
    <line x1="400" y1="400" x2="682" y2="682"/>
    <line x1="400" y1="400" x2="118" y2="682"/>
    <line x1="400" y1="400" x2="118" y2="118"/>
  </g>
  
  <!-- Spiral path and nodes -->
  <g>
    <!-- Row 1: B1 Db2 Eb2 -->
    <circle cx="400" cy="350" r="12" fill="#e6194B" stroke="black"/>
    <text x="400" y="350" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">B1</text>
    
    <circle cx="420" cy="330" r="12" fill="#e6194B" stroke="black"/>
    <text x="420" y="330" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Db2</text>
    
    <circle cx="440" cy="310" r="12" fill="#e6194B" stroke="black"/>
    <text x="440" y="310" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Eb2</text>
    
    <!-- Whole tone connection -->
    <path d="M 400,350 Q 410,340 420,330 Q 430,320 440,310" stroke="#e6194B" stroke-width="2" fill="none"/>
    
    <!-- Row 2: E2 Gb2 Ab2 -->
    <circle cx="455" cy="345" r="12" fill="#3cb44b" stroke="black"/>
    <text x="455" y="345" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">E2</text>
    
    <circle cx="475" cy="325" r="12" fill="#3cb44b" stroke="black"/>
    <text x="475" y="325" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Gb2</text>
    
    <circle cx="495" cy="305" r="12" fill="#3cb44b" stroke="black"/>
    <text x="495" y="305" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Ab2</text>
    
    <!-- Whole tone connection -->
    <path d="M 455,345 Q 465,335 475,325 Q 485,315 495,305" stroke="#3cb44b" stroke-width="2" fill="none"/>
    
    <!-- Perfect fourth connection -->
    <path d="M 440,310 Q 447,327 455,345" stroke="#555" stroke-width="1.5" stroke-dasharray="4" fill="none"/>
    
    <!-- Row 3: A2 B2 Db3 -->
    <circle cx="510" cy="340" r="12" fill="#ffe119" stroke="black"/>
    <text x="510" y="340" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">A2</text>
    
    <circle cx="530" cy="320" r="12" fill="#ffe119" stroke="black"/>
    <text x="530" y="320" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">B2</text>
    
