    <text x="340" y="370" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">F5</text>
    
    <circle cx="360" cy="350" r="12" fill="#a9a9a9" stroke="black"/>
    <text x="360" y="350" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">G5</text>
    
    <!-- Whole tone connection -->
    <path d="M 320,390 Q 330,380 340,370 Q 350,360 360,350" stroke="#a9a9a9" stroke-width="2" fill="none"/>
    
    <!-- Perfect fourth connection -->
    <path d="M 350,425 Q 335,407 320,390" stroke="#555" stroke-width="1.5" stroke-dasharray="4" fill="none"/>
    
