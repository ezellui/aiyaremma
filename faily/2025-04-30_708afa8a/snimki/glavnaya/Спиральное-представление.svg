    <text x="510" y="390" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">D3</text>
    
    <circle cx="530" cy="370" r="12" fill="#4363d8" stroke="black"/>
    <text x="530" y="370" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">E3</text>
    
    <circle cx="550" cy="350" r="12" fill="#4363d8" stroke="black"/>
    <text x="550" y="350" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Gb3</text>
    
    <!-- Whole tone connection -->
    <path d="M 510,390 Q 520,380 530,370 Q 540,360 550,350" stroke="#4363d8" stroke-width="2" fill="none"/>
    
    <!-- Perfect fourth connection -->
    <path d="M 550,300 Q 530,345 510,390" stroke="#555" stroke-width="1.5" stroke-dasharray="4" fill="none"/>
    
    <!-- Row 5: G3 A3 B3 -->
    <circle cx="480" cy="425" r="12" fill="#f58231" stroke="black"/>
    <text x="480" y="425" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">G3</text>
    
    <circle cx="500" cy="405" r="12" fill="#f58231" stroke="black"/>
    <text x="500" y="405" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">A3</text>
    
    <circle cx="520" cy="385" r="12" fill="#f58231" stroke="black"/>
    <text x="520" y="385" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">B3</text>
    
    <!-- Whole tone connection -->
