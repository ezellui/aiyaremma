    <text x="435" y="445" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">C4</text>
    
    <circle cx="455" cy="425" r="12" fill="#911eb4" stroke="black"/>
    <text x="455" y="425" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">D4</text>
    
