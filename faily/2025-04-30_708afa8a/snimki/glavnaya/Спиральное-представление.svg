    <text x="430" y="405" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="black" font-weight="bold">A4</text>
    
    <!-- Whole tone connection -->
    <path d="M 390,445 Q 400,435 410,425 Q 420,415 430,405" stroke="#42d4f4" stroke-width="2" fill="none"/>
    
    <!-- Perfect fourth connection -->
    <path d="M 435,445 Q 413,445 390,445" stroke="#555" stroke-width="1.5" stroke-dasharray="4" fill="none"/>
    
    <!-- Row 8: Bb4 C5 D5 -->
    <circle cx="350" cy="425" r="12" fill="#f032e6" stroke="black"/>
    <text x="350" y="425" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Bb4</text>
    
    <circle cx="370" cy="405" r="12" fill="#f032e6" stroke="black"/>
    <text x="370" y="405" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">C5</text>
    
    <circle cx="390" cy="385" r="12" fill="#f032e6" stroke="black"/>
    <text x="390" y="385" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">D5</text>
    
    <!-- Whole tone connection -->
