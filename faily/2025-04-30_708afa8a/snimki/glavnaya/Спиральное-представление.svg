    <text x="370" y="270" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Gb6</text>
    
    <circle cx="390" cy="250" r="12" fill="#9A6324" stroke="black"/>
    <text x="390" y="250" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Ab6</text>
    
    <circle cx="410" cy="230" r="12" fill="#9A6324" stroke="black"/>
    <text x="410" y="230" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Bb6</text>
    
    <!-- Whole tone connection -->
    <path d="M 370,270 Q 380,260 390,250 Q 400,240 410,230" stroke="#9A6324" stroke-width="2" fill="none"/>
    
    <!-- Perfect fourth connection -->
    <path d="M 385,250 Q 378,260 370,270" stroke="#555" stroke-width="1.5" stroke-dasharray="4" fill="none"/>
    
    <!-- Final perfect fourth connection to complete the cycle -->
    <path d="M 410,230 Q 395,250 400,350" stroke="#555" stroke-width="1.5" stroke-dasharray="4" fill="none" opacity="0.5"/>
  </g>
  
  <!-- Legend -->
  <g transform="translate(400, 720)">
    <text x="0" y="0" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Легенда:</text>
    
    <line x1="-150" y1="20" x2="-100" y2="20" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="-90" y="25" font-size="14" text-anchor="start" font-family="Arial, sans-serif">Восходящая чистая кварта (5 полутонов)</text>
    
    <line x1="50" y1="20" x2="100" y2="20" stroke="#911eb4" stroke-width="2"/>
    <text x="110" y="25" font-size="14" text-anchor="start" font-family="Arial, sans-serif">Целотоновая связь внутри строки (2 полутона)</text>
    
    <text x="0" y="50" font-size="14" text-anchor="middle" font-family="Arial, sans-serif">Спираль показывает восходящее движение по тональностям с сохранением гармонических отношений</text>
  </g>
</svg>
