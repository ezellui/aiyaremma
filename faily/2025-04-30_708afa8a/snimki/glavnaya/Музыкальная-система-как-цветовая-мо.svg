
<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон и заголовок -->
  <rect width="900" height="900" fill="#f9f9f9"/>
  <text x="450" y="50" font-size="24" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Музыкальная система как цветовая модель HSL</text>
  <text x="450" y="80" font-size="16" text-anchor="middle" font-family="Arial, sans-serif">Циклическая структура с квартовым кругом и целотоновыми трезвучиями</text>
  
  <!-- Основная круговая структура -->
  <g transform="translate(450, 460)">
    <!-- Концентрические круги для разных октавных уровней -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ddd" stroke-width="1"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#ddd" stroke-width="1"/>
    <circle cx="0" cy="0" r="180" fill="none" stroke="#ddd" stroke-width="1"/>
    <circle cx="0" cy="0" r="240" fill="none" stroke="#ddd" stroke-width="1"/>
    <circle cx="0" cy="0" r="300" fill="none" stroke="#ddd" stroke-width="1"/>
    <circle cx="0" cy="0" r="360" fill="none" stroke="#ddd" stroke-width="1"/>
    
    <!-- Радиальные линии для 12 позиций нот -->
    <line x1="0" y1="0" x2="0" y2="-360" stroke="#ddd" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="180" y2="-311.8" stroke="#ddd" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="311.8" y2="-180" stroke="#ddd" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="360" y2="0" stroke="#ddd" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="311.8" y2="180" stroke="#ddd" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="180" y2="311.8" stroke="#ddd" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="360" stroke="#ddd" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="-180" y2="311.8" stroke="#ddd" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="-311.8" y2="180" stroke="#ddd" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="-360" y2="0" stroke="#ddd" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="-311.8" y2="-180" stroke="#ddd" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="-180" y2="-311.8" stroke="#ddd" stroke-width="1" opacity="0.6"/>
    
    <!-- Метки для октав (от центра к периферии) -->
    <text x="0" y="-40" font-size="14" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Октава 1</text>
    <text x="0" y="-100" font-size="14" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Октава 2</text>
    <text x="0" y="-160" font-size="14" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Октава 3</text>
    <text x="0" y="-220" font-size="14" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Октава 4</text>
    <text x="0" y="-280" font-size="14" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Октава 5</text>
    <text x="0" y="-340" font-size="14" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Октава 6</text>
    
    <!-- Метки для 12 основных нот по окружности -->
    <text x="0" y="-375" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#6600cc">B</text>
    <text x="187" y="-325" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#8800cc">E</text>
    <text x="325" y="-187" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#aa00cc">A</text>
    <text x="375" y="0" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#cc00cc">D</text>
    <text x="325" y="187" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#cc0099">G</text>
    <text x="187" y="325" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#cc0066">C</text>
    <text x="0" y="375" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#cc0033">F</text>
    <text x="-187" y="325" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#cc0000">Bb</text>
    <text x="-325" y="187" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#cc3300">Eb</text>
    <text x="-375" y="0" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#cc6600">Ab</text>
    <text x="-325" y="-187" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#cc9900">Db</text>
    <text x="-187" y="-325" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#90cc00">Gb</text>
    
    <!-- Квартовый круг по внешней окружности (направление движения) -->
    <path d="M 0,-365 A 365,365 0 0 1 183,-315" stroke="#5b9bd5" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 193,-315 A 365,365 0 0 1 315,-193" stroke="#5b9bd5" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 325,-183 A 365,365 0 0 1 365,0" stroke="#5b9bd5" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 365,10 A 365,365 0 0 1 325,193" stroke="#5b9bd5" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 315,203 A 365,365 0 0 1 193,315" stroke="#5b9bd5" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 183,325 A 365,365 0 0 1 0,365" stroke="#5b9bd5" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -10,365 A 365,365 0 0 1 -193,315" stroke="#5b9bd5" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -203,315 A 365,365 0 0 1 -325,193" stroke="#5b9bd5" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -335,183 A 365,365 0 0 1 -365,0" stroke="#5b9bd5" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -365,-10 A 365,365 0 0 1 -325,-193" stroke="#5b9bd5" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -315,-203 A 365,365 0 0 1 -193,-315" stroke="#5b9bd5" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M -183,-325 A 365,365 0 0 1 -10,-365" stroke="#5b9bd5" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Ноты и их связи -->
    
    <!-- Ряд 1: B1 Db2 Eb2 -->
    <circle cx="0" cy="-60" r="15" fill="#6600cc" stroke="#333"/>
    <text x="0" y="-56" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">B1</text>
    
    <circle cx="-145" cy="-120" r="15" fill="#cc9900" stroke="#333"/>
    <text x="-145" y="-116" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Db2</text>
    
    <circle cx="-210" cy="-120" r="15" fill="#cc3300" stroke="#333"/>
    <text x="-210" y="-116" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Eb2</text>
    
    <path d="M 0,-60 Q -70,-95 -145,-120" stroke="#e6194B" stroke-width="2" fill="none"/>
    <path d="M -145,-120 Q -175,-120 -210,-120" stroke="#e6194B" stroke-width="2" fill="none"/>
    
    <!-- Ряд 2: E2 Gb2 Ab2 -->
    <circle cx="120" cy="-104" r="15" fill="#8800cc" stroke="#333"/>
    <text x="120" y="-100" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">E2</text>
    
    <circle cx="-90" cy="-120" r="15" fill="#90cc00" stroke="#333"/>
    <text x="-90" y="-116" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Gb2</text>
    
    <circle cx="-240" cy="-65" r="15" fill="#cc6600" stroke="#333"/>
    <text x="-240" y="-61" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Ab2</text>
    
    <path d="M 120,-104 Q 20,-125 -90,-120" stroke="#3cb44b" stroke-width="2" fill="none"/>
    <path d="M -90,-120 Q -165,-95 -240,-65" stroke="#3cb44b" stroke-width="2" fill="none"/>
    
    <!-- Ряд 3: A2 B2 Db3 -->
    <circle cx="209" cy="-120" r="15" fill="#aa00cc" stroke="#333"/>
    <text x="209" y="-116" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">A2</text>
    
    <circle cx="0" cy="-120" r="15" fill="#6600cc" stroke="#333"/>
    <text x="0" y="-116" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">B2</text>
    
    <circle cx="-145" cy="-180" r="15" fill="#cc9900" stroke="#333"/>
    <text x="-145" y="-176" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Db3</text>
    
    <path d="M 209,-120 Q 105,-125 0,-120" stroke="#ffe119" stroke-width="2" fill="none"/>
    <path d="M 0,-120 Q -72,-150 -145,-180" stroke="#ffe119" stroke-width="2" fill="none"/>
    
    <!-- Ряд 4: D3 E3 Gb3 -->
    <circle cx="240" cy="0" r="15" fill="#cc00cc" stroke="#333"/>
    <text x="240" y="4" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">D3</text>
    
    <circle cx="120" cy="-166" r="15" fill="#8800cc" stroke="#333"/>
    <text x="120" y="-162" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">E3</text>
    
    <circle cx="-90" cy="-180" r="15" fill="#90cc00" stroke="#333"/>
    <text x="-90" y="-176" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Gb3</text>
    
    <path d="M 240,0 Q 190,-90 120,-166" stroke="#4363d8" stroke-width="2" fill="none"/>
    <path d="M 120,-166 Q 15,-180 -90,-180" stroke="#4363d8" stroke-width="2" fill="none"/>
    
    <!-- Ряд 5: G3 A3 B3 -->
    <circle cx="210" cy="120" r="15" fill="#cc0099" stroke="#333"/>
    <text x="210" y="124" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">G3</text>
    
    <circle cx="209" cy="-180" r="15" fill="#aa00cc" stroke="#333"/>
    <text x="209" y="-176" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">A3</text>
    
    <circle cx="0" cy="-180" r="15" fill="#6600cc" stroke="#333"/>
    <text x="0" y="-176" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">B3</text>
    
    <path d="M 210,120 Q 230,-30 209,-180" stroke="#f58231" stroke-width="2" fill="none"/>
    <path d="M 209,-180 Q 105,-185 0,-180" stroke="#f58231" stroke-width="2" fill="none"/>
    
    <!-- Ряд 6: C4 D4 E4 -->
    <circle cx="120" cy="209" r="15" fill="#cc0066" stroke="#333"/>
    <text x="120" y="213" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">C4</text>
    
    <circle cx="240" cy="-60" r="15" fill="#cc00cc" stroke="#333"/>
    <text x="240" y="-56" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">D4</text>
    
    <circle cx="120" cy="-230" r="15" fill="#8800cc" stroke="#333"/>
    <text x="120" y="-226" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">E4</text>
    
    <path d="M 120,209 Q 200,80 240,-60" stroke="#911eb4" stroke-width="2" fill="none"/>
    <path d="M 240,-60 Q 190,-150 120,-230" stroke="#911eb4" stroke-width="2" fill="none"/>
    
    <!-- Ряд 7: F4 G4 A4 -->
    <circle cx="0" cy="240" r="15" fill="#cc0033" stroke="#333"/>
    <text x="0" y="244" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">F4</text>
    
    <circle cx="210" cy="180" r="15" fill="#cc0099" stroke="#333"/>
    <text x="210" y="184" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">G4</text>
    
    <circle cx="209" cy="-240" r="15" fill="#aa00cc" stroke="#333"/>
    <text x="209" y="-236" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">A4</text>
    
    <path d="M 0,240 Q 120,220 210,180" stroke="#42d4f4" stroke-width="2" fill="none"/>
    <path d="M 210,180 Q 220,-30 209,-240" stroke="#42d4f4" stroke-width="2" fill="none"/>
    
    <!-- Ряд 8: Bb4 C5 D5 -->
    <circle cx="-120" cy="209" r="15" fill="#cc0000" stroke="#333"/>
    <text x="-120" y="213" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Bb4</text>
    
    <circle cx="120" cy="271" r="15" fill="#cc0066" stroke="#333"/>
    <text x="120" y="275" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">C5</text>
    
    <circle cx="240" cy="-120" r="15" fill="#cc00cc" stroke="#333"/>
    <text x="240" y="-116" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">D5</text>
    
    <path d="M -120,209 Q 0,250 120,271" stroke="#f032e6" stroke-width="2" fill="none"/>
    <path d="M 120,271 Q 200,80 240,-120" stroke="#f032e6" stroke-width="2" fill="none"/>
    
    <!-- Ряд 9: Eb5 F5 G5 -->
    <circle cx="-210" cy="120" r="15" fill="#cc3300" stroke="#333"/>
    <text x="-210" y="124" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Eb5</text>
    
    <circle cx="0" cy="300" r="15" fill="#cc0033" stroke="#333"/>
    <text x="0" y="304" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">F5</text>
    
    <circle cx="210" cy="240" r="15" fill="#cc0099" stroke="#333"/>
    <text x="210" y="244" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">G5</text>
    
    <path d="M -210,120 Q -105,230 0,300" stroke="#a9a9a9" stroke-width="2" fill="none"/>
    <path d="M 0,300 Q 110,280 210,240" stroke="#a9a9a9" stroke-width="2" fill="none"/>
    
    <!-- Ряд 10: Ab5 Bb5 C6 -->
    <circle cx="-240" cy="0" r="15" fill="#cc6600" stroke="#333"/>
    <text x="-240" y="4" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Ab5</text>
    
    <circle cx="-120" cy="271" r="15" fill="#cc0000" stroke="#333"/>
    <text x="-120" y="275" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Bb5</text>
    
    <circle cx="120" cy="330" r="15" fill="#cc0066" stroke="#333"/>
    <text x="120" y="334" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">C6</text>
    
    <path d="M -240,0 Q -190,150 -120,271" stroke="#469990" stroke-width="2" fill="none"/>
    <path d="M -120,271 Q 0,310 120,330" stroke="#469990" stroke-width="2" fill="none"/>
    
    <!-- Ряд 11: Db6 Eb6 F6 -->
    <circle cx="-210" cy="-120" r="15" fill="#cc9900" stroke="#333"/>
    <text x="-210" y="-116" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Db6</text>
    
    <circle cx="-210" cy="180" r="15" fill="#cc3300" stroke="#333"/>
    <text x="-210" y="184" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Eb6</text>
    
    <circle cx="0" cy="350" r="15" fill="#cc0033" stroke="#333"/>
    <text x="0" y="354" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">F6</text>
    
    <path d="M -210,-120 Q -230,30 -210,180" stroke="#e6beff" stroke-width="2" fill="none"/>
    <path d="M -210,180 Q -105,280 0,350" stroke="#e6beff" stroke-width="2" fill="none"/>
    
    <!-- Ряд 12: Gb6 Ab6 Bb6 -->
    <circle cx="-120" cy="-209" r="15" fill="#90cc00" stroke="#333"/>
    <text x="-120" y="-205" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Gb6</text>
    
    <circle cx="-240" cy="-60" r="15" fill="#cc6600" stroke="#333"/>
    <text x="-240" y="-56" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Ab6</text>
    
    <circle cx="-120" cy="330" r="15" fill="#cc0000" stroke="#333"/>
    <text x="-120" y="334" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="white" font-weight="bold">Bb6</text>
    
    <path d="M -120,-209 Q -190,-150 -240,-60" stroke="#9A6324" stroke-width="2" fill="none"/>
    <path d="M -240,-60 Q -190,150 -120,330" stroke="#9A6324" stroke-width="2" fill="none"/>
    
    <!-- Соединение от последней ноты к первой, чтобы замкнуть цикл -->
    <path d="M -120,330 Q -80,150 0,-60" stroke="#5b9bd5" stroke-width="2" fill="none" stroke-dasharray="5,3" opacity="0.6"/>
  </g>
  
  <!-- Легенда -->
  <g transform="translate(450, 850)">
    <rect x="-300" y="-20" width="600" height="70" rx="10" fill="#f0f0f0" stroke="#333"/>
    <text x="0" y="0" font-size="16" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">Легенда:</text>
    
    <line x1="-280" y1="20" x2="-230" y2="20" stroke="#5b9bd5" stroke-width="2"/>
    <text x="-220" y="25" font-size="14" text-anchor="start" font-family="Arial, sans-serif">Квартовый круг (5 полутонов)</text>
    
    <line x1="-30" y1="20" x2="20" y2="20" stroke="#911eb4" stroke-width="2"/>
    <text x="30" y="25" font-size="14" text-anchor="start" font-family="Arial, sans-serif">Целотоновые трезвучия (2 полутона)</text>
    
    <path d="M -280,40 L -230,40" stroke="#5b9bd5" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="-220" y="45" font-size="14" text-anchor="start" font-family="Arial, sans-serif">Замыкание цикла</text>
  </g>
  
  <!-- Маркеры для стрелок -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5b9bd5"/>
    </marker>
  </defs>
</svg>
