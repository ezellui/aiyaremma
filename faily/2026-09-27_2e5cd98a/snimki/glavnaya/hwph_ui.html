<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HWPh — читальня</title>
<style>
:root{
  --paper:#F2F3EF; --paper-2:#E7E9E3; --ink:#1D2320; --ink-2:#56605A; --rule:#CDD2CA;
  --cloth:#2E5A43; --cloth-ink:#F2F3EF; --brass:#8A6A22; --mark:#E6E09A; --mark-cur:#D4C24E;
  --link:#245A70; --dead:#8B8F88;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Cambria","Times New Roman",serif;
  --sans:"Segoe UI",Tahoma,"Helvetica Neue",Arial,sans-serif;
  --fs:19px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B201D; --paper-2:#232A26; --ink:#DADFD6; --ink-2:#9AA59C; --rule:#35403A;
    --cloth:#2F5E47; --cloth-ink:#E9EEE6; --brass:#C9A95A; --mark:#5C5A26; --mark-cur:#8C8327;
    --link:#8CC0D6; --dead:#77807A;
  }
}
:root[data-theme="dark"]{
  --paper:#1B201D; --paper-2:#232A26; --ink:#DADFD6; --ink-2:#9AA59C; --rule:#35403A;
  --cloth:#2F5E47; --cloth-ink:#E9EEE6; --brass:#C9A95A; --mark:#5C5A26; --mark-cur:#8C8327;
  --link:#8CC0D6; --dead:#77807A;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;display:flex;flex-direction:column}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button,select,input{font:inherit;color:inherit}

/* top bar: the cloth spine */
#bar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--cloth);color:var(--cloth-ink)}
#bar .brand{font-family:var(--serif);font-size:22px;letter-spacing:.02em;color:var(--cloth-ink);white-space:nowrap}
#bar .brand small{font-size:13px;opacity:.75;margin-left:6px}
#q{flex:1;min-width:120px;max-width:680px;padding:7px 10px;border:1px solid transparent;border-radius:3px;background:var(--paper);color:var(--ink)}
#bar select{padding:6px;border-radius:3px;border:0;background:var(--paper);color:var(--ink)}
#bar button{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--cloth-ink);border-radius:3px;padding:5px 9px;cursor:pointer}
#bar button:hover{background:rgba(255,255,255,.12)}
#menu{display:none}

#main{flex:1;display:flex;min-height:0}
/* index of lemmas */
#index{width:290px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--rule);background:var(--paper-2)}
#index input{margin:10px;padding:6px 8px;border:1px solid var(--rule);border-radius:3px;background:var(--paper)}
#index .count{padding:0 12px 6px;color:var(--ink-2);font-size:12.5px}
#list{flex:1;overflow:auto;padding-bottom:20px}
#list a{display:flex;justify-content:space-between;gap:8px;padding:3px 12px;color:var(--ink);font-family:var(--serif);font-size:15.5px;line-height:1.3}
#list a span{color:var(--ink-2);font-family:var(--sans);font-size:11.5px;white-space:nowrap;padding-top:3px}
#list a:hover{background:var(--paper);text-decoration:none}
#list a.cur{background:var(--paper);box-shadow:inset 3px 0 0 var(--cloth)}
#list .letter{font-family:var(--serif);font-size:20px;color:var(--brass);padding:10px 12px 2px}

#view{flex:1;overflow:auto;scroll-behavior:auto}
.page{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:40px;max-width:1120px;margin:0 auto;padding:28px 32px 80px}
.page.wide{grid-template-columns:minmax(0,1fr)}

/* article */
.text{max-width:40em;font-family:var(--serif);font-size:var(--fs);line-height:1.62;hyphens:auto;-webkit-hyphens:auto}
.head{position:relative;margin:4px 0 26px;padding-left:18px;border-left:3px solid var(--brass)}
.head h1{font-family:var(--serif);font-weight:normal;font-size:2.1em;line-height:1.12;margin:0 0 10px;letter-spacing:-.005em}
.head .cols{font-family:var(--sans);font-size:13px;color:var(--ink-2);line-height:1.6}
.head .cols b{font-weight:600;color:var(--ink)}
.text p{margin:0 0 .75em;text-align:left}
.text p[id]{margin-top:1.1em}
.text p.lit{font-size:.84em;line-height:1.5;color:var(--ink-2);margin-bottom:.45em}
.text h3{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink-2);margin:2em 0 .6em;padding-top:.6em;border-top:1px solid var(--rule)}
.text sup.fn{font-family:var(--sans);font-size:.6em;color:var(--link);cursor:pointer;padding:0 1px;vertical-align:.55em;line-height:0}
.text sup.fn:hover{text-decoration:underline}
.text ol.notes{font-size:.8em;line-height:1.5;padding-left:2.6em;color:var(--ink)}
.text ol.notes li{margin:0 0 .35em}
.text ol.notes li:target, .text ol.notes li.flash{background:var(--mark)}
.text .xref{border-bottom:1px solid var(--rule)}
.text .xref:hover{text-decoration:none;border-bottom-color:var(--link)}
.text .xref-dead{color:var(--dead)}
.text .sd{font-family:var(--sans);font-size:.72em;color:var(--ink-2)}
.text .gap{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);border:1px dashed var(--rule);padding:6px 10px;margin:1em 0}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
mark.cur{background:var(--mark-cur)}

/* the margin rail */
.rail{font-size:13.5px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:28px 0 40px}
.rail h4{font-size:12.5px;font-weight:600;color:var(--ink-2);margin:18px 0 6px}
.rail h4:first-child{margin-top:0}
.rail ul{list-style:none;margin:0;padding:0}
.rail li{margin:2px 0;line-height:1.35}
.rail .toc a{color:var(--ink)}
.rail .toc li.l2{padding-left:12px}
.rail .toc li.l3{padding-left:24px;color:var(--ink-2)}
.rail .toc li.l3 a{color:var(--ink-2)}
.rail .n{color:var(--ink-2);font-size:12px}
.rail .reg{column-count:1}
.rail .reg li{font-family:var(--serif);font-size:14.5px}
.rail .more{background:none;border:0;padding:2px 0;color:var(--link);cursor:pointer}
.hitnav{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;background:var(--paper);border-bottom:1px solid var(--rule);padding:6px 0;margin:-10px 0 16px;font-family:var(--sans);font-size:13px;color:var(--ink-2)}
.hitnav button{border:1px solid var(--rule);background:var(--paper-2);border-radius:3px;padding:2px 9px;cursor:pointer}
.pager{display:flex;justify-content:space-between;gap:20px;margin-top:48px;padding-top:14px;border-top:1px solid var(--rule);font-family:var(--serif);font-size:16px}
.pager small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-2)}
.pager .nx{text-align:right}

/* results */
.results{max-width:52em}
.results h2{font-family:var(--serif);font-weight:normal;font-size:26px;margin:4px 0 4px}
.results .sub{color:var(--ink-2);margin-bottom:22px}
.hit{padding:14px 0 16px;border-bottom:1px solid var(--rule)}
.hit .t{font-family:var(--serif);font-size:20px}
.hit .m{font-size:12.5px;color:var(--ink-2);margin:2px 0 6px}
.hit .m .c{display:inline-block;margin-right:10px}
.hit .s{font-family:var(--serif);font-size:15.5px;line-height:1.5;margin:4px 0}
.hit .s em{font-style:normal;font-family:var(--sans);font-size:11.5px;color:var(--brass);margin-right:6px}
.regbox{background:var(--paper-2);border-left:3px solid var(--brass);padding:10px 14px;margin:0 0 20px}
.regbox h3{font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.regbox table{border-collapse:collapse;font-size:14px}
.regbox td{padding:2px 14px 2px 0;vertical-align:top}
.regbox td.term{font-family:var(--serif);font-size:15.5px}
.regbox td.loc{color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.btn{border:1px solid var(--rule);background:var(--paper-2);padding:7px 14px;border-radius:3px;cursor:pointer;margin-top:18px}
.err{color:#A23B2A;padding:14px 0}

/* home */
.home{max-width:44em;font-family:var(--serif);font-size:18px;line-height:1.6}
.home h2{font-weight:normal;font-size:34px;margin:10px 0 6px}
.home .facts{font-family:var(--sans);font-size:14px;color:var(--ink-2);margin-bottom:26px}
.home table{font-family:var(--sans);font-size:14px;border-collapse:collapse;margin:8px 0 18px}
.home td{padding:4px 18px 4px 0;vertical-align:top}
.home code{font-family:Consolas,"Courier New",monospace;font-size:13.5px;background:var(--paper-2);padding:1px 5px;border-radius:2px}

/* footnote popover */
#pop{position:fixed;z-index:20;max-width:460px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-top:3px solid var(--cloth);padding:10px 12px;font-family:var(--serif);font-size:15px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.18);display:none}
#pop b.no{font-family:var(--sans);font-size:12px;color:var(--ink-2);margin-right:6px}

@media (max-width:1100px){ .page{grid-template-columns:minmax(0,1fr)} .rail{position:static;max-height:none;padding-top:0;border-top:1px solid var(--rule)} }
@media (max-width:760px){
  #index{position:fixed;z-index:10;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .18s;box-shadow:0 0 30px rgba(0,0,0,.3)}
  body.idx #index{transform:none}
  #menu{display:inline-block}
  #bar .brand small{display:none}
  .page{padding:18px 16px 60px}
  :root{--fs:17px}
}
@media (prefers-reduced-motion: reduce){ #index{transition:none} }
</style>
</head>
<body>
<div id="bar">
  <button id="menu" title="Список статей">☰</button>
  <a class="brand" href="#/">HWPh<small>Historisches Wörterbuch der Philosophie</small></a>
  <input id="q" type="search" placeholder="Поиск по словарю  ( / )" autocomplete="off" spellcheck="false">
  <select id="scope" title="Где искать">
    <option value="all">везде</option>
    <option value="body">в тексте статей</option>
    <option value="notes">в примечаниях</option>
    <option value="lit">в литературе</option>
    <option value="lemma">в леммах</option>
    <option value="authors">по авторам статей</option>
    <option value="register">в регистре</option>
  </select>
  <select id="band" title="Том"><option value="">все тома</option></select>
  <button id="smaller" title="Мельче">A−</button>
  <button id="bigger" title="Крупнее">A+</button>
  <button id="theme" title="Светлая / тёмная тема">◐</button>
</div>
<div id="main">
  <nav id="index">
    <input id="filter" type="search" placeholder="Лемма…" autocomplete="off" spellcheck="false">
    <div class="count" id="count"></div>
    <div id="list"></div>
  </nav>
  <div id="view"></div>
</div>
<div id="pop"></div>
<script>
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const view = $('#view'), list = $('#list');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (path) => {
  const r = await fetch(path);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem('hwph.' + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hwph.' + k, v); } catch (e) {} }
};

/* ---------- folding: same rules as the server ---------- */
const DROP = new Set('´′`˜¨᾿῾῀΄΅');
const foldCache = new Map();
function foldChar(c) {
  let f = foldCache.get(c);
  if (f !== undefined) return f;
  if (DROP.has(c)) f = '';
  else if (c === 'ß') f = 'ss';
  else f = c.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(/ς/g, 'σ').replace(/ı/g, 'i');
  foldCache.set(c, f);
  return f;
}
function fold(s) { let o = ''; for (const c of s) o += foldChar(c); return o; }
function foldMap(s) {
  let o = '', idx = [], i = 0;
  for (const c of s) { const f = foldChar(c); o += f; for (let k = 0; k < f.length; k++) idx.push(i); i += c.length; }
  return [o, idx];
}
function queryRegex(q) {
  const pats = [];
  const re = /(-?)"([^"]+)"(\*?)|(\S+)/g; let m;
  while ((m = re.exec(q))) {
    let w, neg, prefix;
    if (m[4] !== undefined) {
      w = m[4]; if (w === 'OR' || w === '|') continue;
      neg = w.length > 1 && w[0] === '-'; if (neg) w = w.slice(1);
      prefix = w.endsWith('*');
    } else { w = m[2]; neg = !!m[1]; prefix = !!m[3]; }
    if (neg) continue;
    const toks = fold(w).match(/[\p{L}\p{N}_]+/gu);
    if (!toks) continue;
    const t = toks.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    if (prefix) t[t.length - 1] += '[\\p{L}\\p{N}_]*';
    pats.push('(?<![\\p{L}\\p{N}_])' + t.join('[^\\p{L}\\p{N}_]{1,4}') + '(?![\\p{L}\\p{N}_])');
  }
  return pats.length ? new RegExp(pats.join('|'), 'gu') : null;
}

/* ---------- settings ---------- */
function applyTheme() {
  const t = store.get('theme', '');
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
}
function applySize() { document.documentElement.style.setProperty('--fs', store.get('fs', '19') + 'px'); }
applyTheme(); applySize();
$('#theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = store.get('theme', '') || (dark ? 'dark' : 'light');
  store.set('theme', cur === 'dark' ? 'light' : 'dark'); applyTheme();
};
$('#smaller').onclick = () => { store.set('fs', Math.max(14, +store.get('fs', '19') - 1)); applySize(); };
$('#bigger').onclick = () => { store.set('fs', Math.min(26, +store.get('fs', '19') + 1)); applySize(); };
$('#menu').onclick = () => document.body.classList.toggle('idx');

/* ---------- lemma index ---------- */
let LEMMAS = [], INFO = {}, curId = null;
function renderList(filter) {
  const f = fold(filter.trim());
  let rows = LEMMAS;
  if (f) {
    const pre = [], inner = [];
    for (const r of LEMMAS) { const i = r.f.indexOf(f); if (i === 0) pre.push(r); else if (i > 0) inner.push(r); }
    rows = pre.concat(inner);
  }
  $('#count').textContent = f ? `${rows.length} из ${LEMMAS.length}` : `${LEMMAS.length} статей`;
  const out = []; let letter = '';
  for (const r of rows.slice(0, f ? 600 : rows.length)) {
    if (!f) { const L = r.f[0] ? r.f[0].toUpperCase() : ''; if (L !== letter) { letter = L; out.push(`<div class="letter">${esc(L)}</div>`); } }
    out.push(`<a href="#/a/${r.id}" data-id="${r.id}"${r.id === curId ? ' class="cur"' : ''}>${esc(r.lemma)}<span>${esc(r.band)}, ${r.col}</span></a>`);
  }
  list.innerHTML = out.join('');
}
let ft; $('#filter').addEventListener('input', e => { clearTimeout(ft); ft = setTimeout(() => renderList(e.target.value), 80); });
$('#filter').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const a = list.querySelector('a'); if (a) location.hash = a.getAttribute('href'); }
});
function markCurrent() {
  list.querySelectorAll('a.cur').forEach(a => a.classList.remove('cur'));
  const a = list.querySelector(`a[data-id="${curId}"]`);
  if (a) { a.classList.add('cur'); const r = a.getBoundingClientRect(), lr = list.getBoundingClientRect();
    if (r.top < lr.top || r.bottom > lr.bottom) a.scrollIntoView({block: 'center'}); }
}

/* ---------- routing ---------- */
function parseHash() {
  const h = location.hash.slice(1) || '/';
  const [path, qs] = h.split('?');
  return {path, params: new URLSearchParams(qs || '')};
}
window.addEventListener('hashchange', route);
async function route() {
  const {path, params} = parseHash();
  document.body.classList.remove('idx');
  hidePop();
  let m;
  try {
    if ((m = path.match(/^\/a\/(\d+)$/))) return await showArticle(+m[1], params.get('q') || '');
    if (path === '/s') return await showSearch(params);
    showHome();
  } catch (e) { view.innerHTML = `<div class="page wide"><div class="err">${esc(e.message)}</div></div>`; }
}

/* ---------- home ---------- */
function showHome() {
  curId = null; markCurrent();
  const s = INFO.stats || {};
  document.title = 'HWPh — читальня';
  view.innerHTML = `<div class="page wide"><div class="home">
    <h2>Historisches Wörterbuch der Philosophie</h2>
    <div class="facts">${s.articles || '…'} статей в 12 томах, ${s.register || '…'} строк регистра, ${s.xrefs_resolved || '…'} внутренних ссылок · база собрана ${esc(s.built || '')}</div>
    <p>Слева — все леммы по алфавиту, фильтр сверху списка. Строка поиска ищет по всему тексту словаря без учёта умлаутов, ударений и придыханий: <i>aufklarung</i> найдёт «Aufklärung», <i>απειρον</i> — «ἄπειρον».</p>
    <table>
      <tr><td><code>Seele Leib</code></td><td>обе формы в одной статье</td></tr>
      <tr><td><code>"anima mundi"</code></td><td>точная фраза</td></tr>
      <tr><td><code>transzendent*</code></td><td>по началу слова</td></tr>
      <tr><td><code>Hegel OR Schelling</code></td><td>любое из двух</td></tr>
      <tr><td><code>Seele -Leib</code></td><td>без статей, где встречается второе</td></tr>
    </table>
    <p>Выбор «в регистре» ищет по указателю 13-го тома: термины, греческие и латинские выражения, отсылки к статьям и колонкам.</p>
    <p><a href="#" id="rnd">Открыть случайную статью</a></p>
  </div></div>`;
  $('#rnd').onclick = e => { e.preventDefault(); const r = LEMMAS[Math.floor(Math.random() * LEMMAS.length)]; location.hash = '#/a/' + r.id; };
  view.scrollTop = 0;
}

/* ---------- article ---------- */
let hits = [], hitIdx = -1;
async function showArticle(id, q) {
  const a = await api('/api/article/' + id);
  curId = id; markCurrent();
  document.title = a.lemma + ' — HWPh';
  const toc = a.toc.filter(t => t[2] > 0 || t[0] === 'notes' || /^h/.test(t[0]));
  const railList = (title, arr, fmt, cap) => {
    if (!arr.length) return '';
    const items = arr.map(fmt);
    const shown = items.slice(0, cap).join(''), rest = items.slice(cap).join('');
    return `<h4>${title} <span class="n">${arr.length}</span></h4><ul>${shown}</ul>` +
      (rest ? `<ul hidden>${rest}</ul><button class="more">ещё ${items.length - cap}</button>` : '');
  };
  const lk = x => `<li><a href="#/a/${x.id}">${esc(x.lemma)}</a>${x.n > 1 ? ` <span class="n">×${x.n}</span>` : ''}</li>`;
  const reg = r => `<li>${esc(r.term)}${r.qualifier ? ` <span class="n">${esc(r.qualifier)}</span>` : ''}${r.col ? ` <span class="n">Sp. ${esc(r.col)}</span>` : ''}</li>`;
  const authors = a.authors.length ? a.authors.map(esc).join(', ') : '<span style="opacity:.7">автор не указан</span>';
  view.innerHTML = `<div class="page"><article class="text" lang="de">
      ${q ? `<div class="hitnav"><span id="hc"></span><button id="hp" title="Предыдущее">▲</button><button id="hn" title="Следующее">▼</button><a href="#/s?q=${encodeURIComponent(q)}">к результатам</a></div>` : ''}
      <header class="head"><h1>${esc(a.lemma)}</h1>
        <div class="cols"><b>Band ${esc(a.band)}, Sp. ${a.col_from}${a.col_to !== a.col_from ? '–' + a.col_to : ''}</b><br>${authors}<br>страницы PDF ${a.pdf_from}–${a.pdf_to}</div>
      </header>
      <div id="body">${a.html}</div>
      <nav class="pager">
        <div>${a.prev ? `<a href="#/a/${a.prev.id}"><small>предыдущая в томе</small>${esc(a.prev.lemma)}</a>` : ''}</div>
        <div class="nx">${a.next ? `<a href="#/a/${a.next.id}"><small>следующая в томе</small>${esc(a.next.lemma)}</a>` : ''}</div>
      </nav>
    </article>
    <aside class="rail">
      ${toc.length > 1 ? `<h4>Разделы</h4><ul class="toc">${toc.map(t => `<li class="l${t[2]}"><a href="#" data-to="${t[0]}">${esc(t[1])}</a></li>`).join('')}</ul>` : ''}
      ${railList('Ссылки из статьи', a.outlinks, lk, 12)}
      ${railList('Ссылаются сюда', a.backlinks, lk, 12)}
      ${railList('См. также (регистр)', a.see_also, lk, 12)}
      ${railList('В регистре под словами', a.register, reg, 15)}
    </aside></div>`;
  view.querySelectorAll('.rail .more').forEach(b => b.onclick = () => { b.previousElementSibling.hidden = false; b.remove(); });
  view.querySelectorAll('.rail [data-to]').forEach(x => x.onclick = e => { e.preventDefault(); const t = document.getElementById(x.dataset.to); if (t) t.scrollIntoView({block: 'start'}); });
  view.scrollTop = 0;
  hits = []; hitIdx = -1;
  if (q) {
    highlight($('#body'), queryRegex(q));
    hits = [...view.querySelectorAll('#body mark')];
    $('#hc').textContent = hits.length ? `совпадений: ${hits.length}` : 'в тексте статьи совпадений нет (возможно, в лемме или имени автора)';
    $('#hp').onclick = () => gotoHit(-1); $('#hn').onclick = () => gotoHit(1);
    if (hits.length) gotoHit(1);
  }
}
function gotoHit(d) {
  if (!hits.length) return;
  if (hitIdx >= 0) hits[hitIdx].classList.remove('cur');
  hitIdx = (hitIdx + d + hits.length) % hits.length;
  const h = hits[hitIdx]; h.classList.add('cur');
  h.scrollIntoView({block: 'center'});
  $('#hc').textContent = `совпадение ${hitIdx + 1} из ${hits.length}`;
}
function highlight(root, rx) {
  if (!rx) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while ((n = walker.nextNode())) if (n.nodeValue.trim() && !n.parentNode.closest('sup')) nodes.push(n);
  for (const node of nodes) {
    const text = node.nodeValue, [f, idx] = foldMap(text);
    rx.lastIndex = 0; const found = []; let m;
    while ((m = rx.exec(f))) { if (!m[0].length) { rx.lastIndex++; continue; } found.push([idx[m.index], idx[m.index + m[0].length - 1] + 1]); }
    if (!found.length) continue;
    const frag = document.createDocumentFragment(); let pos = 0;
    for (const [s, e] of found) {
      if (s < pos) continue;
      frag.appendChild(document.createTextNode(text.slice(pos, s)));
      const mk = document.createElement('mark'); mk.textContent = text.slice(s, e); frag.appendChild(mk);
      pos = e;
    }
    frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  }
}

/* ---------- footnote popovers ---------- */
const pop = $('#pop'); let popFor = null;
function hidePop() { pop.style.display = 'none'; popFor = null; }
function showPop(sup) {
  const li = document.getElementById('fn' + sup.dataset.fn);
  if (!li) return;
  pop.innerHTML = `<b class="no">${esc(sup.textContent)}</b>` + li.innerHTML;
  pop.style.display = 'block';
  const r = sup.getBoundingClientRect(), w = Math.min(460, innerWidth - 20);
  pop.style.maxWidth = w + 'px';
  let x = Math.min(Math.max(10, r.left - 40), innerWidth - w - 10);
  let y = r.bottom + 8;
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
  const pr = pop.getBoundingClientRect();
  if (pr.bottom > innerHeight - 8) pop.style.top = Math.max(8, r.top - pr.height - 8) + 'px';
  popFor = sup;
}
view.addEventListener('mouseover', e => { const s = e.target.closest('sup.fn'); if (s && s !== popFor) showPop(s); });
view.addEventListener('mouseout', e => { const s = e.target.closest('sup.fn'); if (s && !pop.contains(e.relatedTarget)) setTimeout(() => { if (!pop.matches(':hover')) hidePop(); }, 120); });
pop.addEventListener('mouseleave', hidePop);
view.addEventListener('scroll', hidePop, {passive: true});
view.addEventListener('click', e => {
  const s = e.target.closest('sup.fn');
  if (!s) return;
  const li = document.getElementById('fn' + s.dataset.fn);
  if (!li) return;
  hidePop();
  li.scrollIntoView({block: 'center'});
  li.classList.add('flash'); setTimeout(() => li.classList.remove('flash'), 1600);
});

/* ---------- search ---------- */
const qInput = $('#q'), scopeSel = $('#scope'), bandSel = $('#band');
function submitSearch() {
  const q = qInput.value.trim(); if (!q) return;
  const p = new URLSearchParams({q});
  if (scopeSel.value !== 'all') p.set('scope', scopeSel.value);
  if (bandSel.value) p.set('band', bandSel.value);
  location.hash = '#/s?' + p.toString();
}
qInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitSearch(); });
scopeSel.onchange = bandSel.onchange = () => { if (qInput.value.trim()) submitSearch(); };
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); qInput.focus(); qInput.select(); }
  if (curId && hits.length && (e.key === 'n' || e.key === 'N') && document.activeElement.tagName !== 'INPUT') gotoHit(e.key === 'n' ? 1 : -1);
});
const where = {body: 'текст', notes: 'примечания', lit: 'литература'};
function regTable(rows) {
  return `<table>${rows.map(r => `<tr><td class="term">${esc(r.term)}</td><td>${r.id ? `<a href="#/a/${r.id}">${esc(r.lemma)}</a>` : esc(r.target)}${r.qualifier ? ` <span class="n">${esc(r.qualifier)}</span>` : ''}</td><td class="loc">${r.band ? `Bd. ${esc(r.band)}, Sp. ${esc(r.col)}` : ''}</td></tr>`).join('')}</table>`;
}
async function showSearch(params) {
  const q = params.get('q') || '', scope = params.get('scope') || 'all', band = params.get('band') || '';
  qInput.value = q; scopeSel.value = scope; bandSel.value = band;
  curId = null; markCurrent();
  document.title = q + ' — поиск HWPh';
  if (scope === 'register') {
    const rows = await api('/api/register?q=' + encodeURIComponent(q));
    view.innerHTML = `<div class="page wide"><div class="results"><h2>Регистр: «${esc(q)}»</h2>
      <div class="sub">${rows.length ? `строк: ${rows.length}${rows.length >= 300 ? ' (показаны первые 300)' : ''}` : 'В регистре таких слов нет. Регистр ищет по началу термина; попробуйте поиск «везде».'}</div>
      ${rows.length ? `<div class="regbox">${regTable(rows)}</div>` : ''}</div></div>`;
    view.scrollTop = 0; return;
  }
  const base = `/api/search?q=${encodeURIComponent(q)}&scope=${scope}&band=${encodeURIComponent(band)}`;
  const r = await api(base + '&offset=0&limit=20');
  const qq = encodeURIComponent(q);
  const item = it => {
    const h = it.hits, parts = [];
    if (h.body) parts.push(`<span class="c">в тексте ${h.body}</span>`);
    if (h.notes) parts.push(`<span class="c">в примечаниях ${h.notes}</span>`);
    if (h.lit) parts.push(`<span class="c">в литературе ${h.lit}</span>`);
    return `<div class="hit"><a class="t" href="#/a/${it.id}?q=${qq}">${esc(it.lemma)}</a>
      <div class="m"><span class="c">Bd. ${esc(it.band)}, Sp. ${it.col_from}–${it.col_to}</span>${it.authors.length ? `<span class="c">${it.authors.map(esc).join(', ')}</span>` : ''}${parts.join('')}</div>
      ${it.snippets.map(s => `<div class="s"><em>${where[s.where] || ''}</em>${s.html}</div>`).join('')}</div>`;
  };
  const regRows = r.register || [];
  view.innerHTML = `<div class="page wide"><div class="results">
    <h2>«${esc(q)}»</h2>
    <div class="sub">${r.total ? `статей: ${r.total}` : 'Ничего не найдено. Проверьте написание или ищите по началу слова со звёздочкой: <i>' + esc(q.split(/\s+/)[0]) + '*</i>'}${band ? `, том ${esc(band)}` : ''}</div>
    ${regRows.length ? `<div class="regbox"><h3>В регистре</h3>${regTable(regRows.slice(0, 12))}${regRows.length > 12 ? `<a href="#/s?q=${qq}&scope=register">весь регистр по слову (${regRows.length >= 40 ? '40+' : regRows.length})</a>` : ''}</div>` : ''}
    <div id="hits">${r.items.map(item).join('')}</div>
    ${r.total > 20 ? '<button class="btn" id="more">Показать ещё</button>' : ''}
  </div></div>`;
  view.scrollTop = 0;
  let offset = 20;
  const more = $('#more');
  if (more) more.onclick = async () => {
    more.disabled = true;
    const r2 = await api(base + `&offset=${offset}&limit=20`);
    $('#hits').insertAdjacentHTML('beforeend', r2.items.map(item).join(''));
    offset += 20; more.disabled = false;
    if (offset >= r.total) more.remove();
  };
}

/* ---------- start ---------- */
(async function init() {
  try {
    INFO = await api('/api/info');
    const rows = await api('/api/lemmas');
    LEMMAS = rows.map(r => ({id: r[0], lemma: r[1], band: r[2], col: r[3], f: fold(r[1])}));
    const bands = [...new Set(rows.filter(r => r[4] === 'article').map(r => r[2]))].sort((a, b) => parseInt(a) - parseInt(b));
    bandSel.insertAdjacentHTML('beforeend', bands.map(b => `<option value="${esc(b)}">том ${esc(b)}</option>`).join(''));
    renderList('');
    route();
  } catch (e) {
    view.innerHTML = `<div class="page wide"><div class="err">Сервер читалки не отвечает: ${esc(e.message)}. Запустите <code>python hwph_serve.py</code> и откройте адрес, который он напечатает.</div></div>`;
  }
})();
</script>
