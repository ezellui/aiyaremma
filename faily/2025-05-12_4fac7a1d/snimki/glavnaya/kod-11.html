<div class="control-group">
    <h3>Тип решётки</h3>
    <div class="toggle-container">
        <span>Стандартная</span>
        <label class="toggle-switch">
            <input type="checkbox" id="use-transformed-grid">
            <span class="toggle-slider"></span>
        </label>
        <span>Преобразованная</span>
    </div>
    <div class="control-group">
        <label class="control-label">Плотность решётки</label>
        <input type="range" id="grid-density-range" class="range-input" min="0.1" max="2" step="0.1" value="0.5">
        <div class="range-values">
            <span>Редкая</span>
            <span>Средняя</span>
            <span>Плотная</span>
        </div>
    </div>
    <div class="control-group">
        <label class="control-label">Толщина линий</label>
        <input type="range" id="grid-thickness-range" class="range-input" min="0.01" max="0.2" step="0.01" value="0.05">
        <div class="range-values">
            <span>Тонкие</span>
            <span>Средние</span>
            <span>Толстые</span>
        </div>
    </div>
</div>
