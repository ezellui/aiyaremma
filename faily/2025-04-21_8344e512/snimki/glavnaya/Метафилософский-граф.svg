
<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Определение стилей -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="circle" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3" fill="#333" />
    </marker>
  </defs>
  
  <!-- Узлы графа -->
  <!-- Основные категории метафилософии -->
  <g>
    <!-- Центральные понятия -->
    <circle cx="500" cy="400" r="50" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
    <text x="500" y="400" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="14" font-weight="bold">Философская рефлексия</text>
    
    <!-- Сущностные понятия метафилософии -->
    <circle cx="300" cy="200" r="40" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="300" y="200" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="14" font-weight="bold">Природа философии</text>
    
    <circle cx="700" cy="200" r="40" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="700" y="200" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="14" font-weight="bold">Методология философии</text>
    
    <circle cx="200" cy="400" r="40" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="200" y="400" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="14" font-weight="bold">Границы философского знания</text>
    
    <circle cx="800" cy="400" r="40" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="800" y="400" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="14" font-weight="bold">Критерии философской истины</text>
    
    <circle cx="300" cy="600" r="40" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="300" y="600" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="14" font-weight="bold">Историчность философии</text>
    
    <circle cx="700" cy="600" r="40" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="700" y="600" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="14" font-weight="bold">Диалектика изучения и создания</text>
    
    <!-- Вторичные понятия -->
    <circle cx="120" cy="300" r="35" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
    <text x="120" y="300" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="12">Легитимация философии</text>
    
    <circle cx="150" cy="500" r="35" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
    <text x="150" y="500" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="12">Герменевтика философских текстов</text>
    
    <circle cx="450" cy="650" r="35" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
    <text x="450" y="650" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="12">Философская традиция</text>
    
    <circle cx="550" cy="650" r="35" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
    <text x="550" y="650" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="12">Философское творчество</text>
    
    <circle cx="850" cy="300" r="35" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
    <text x="850" y="300" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="12">Концептуальный аппарат</text>
    
    <circle cx="880" cy="500" r="35" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
    <text x="880" y="500" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="12">Философский аргумент</text>
    
    <circle cx="450" cy="150" r="35" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
    <text x="450" y="150" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="12">Онтологические предпосылки</text>
    
    <circle cx="550" cy="150" r="35" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>
    <text x="550" y="150" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="12">Эпистемологические основания</text>
    
    <!-- Периферийные понятия -->
    <circle cx="100" cy="175" r="30" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="100" y="175" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="11">Философская интуиция</text>
    
    <circle cx="900" cy="175" r="30" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="900" y="175" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="11">Философская практика</text>
    
    <circle cx="150" cy="650" r="30" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="150" y="650" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="11">Идентичность философа</text>
    
    <circle cx="850" cy="650" r="30" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="850" y="650" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="11">Философский прогресс</text>
  </g>
  
  <!-- Связи-рёбра графа -->
  <!-- 1. Конституирование - определяет сущностные характеристики -->
  <g stroke="#2e7d32" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrowhead)">
    <path d="M 500,350 L 350,220" fill="none"/>
    <text x="400" y="265" font-family="Arial" font-size="10" fill="#2e7d32" text-anchor="middle">Конституирует</text>
    
    <path d="M 500,350 L 650,220" fill="none"/>
    <text x="600" y="265" font-family="Arial" font-size="10" fill="#2e7d32" text-anchor="middle">Конституирует</text>
    
    <path d="M 450,350 L 240,380" fill="none"/>
    <text x="335" y="345" font-family="Arial" font-size="10" fill="#2e7d32" text-anchor="middle">Конституирует</text>
    
    <path d="M 550,350 L 760,380" fill="none"/>
    <text x="665" y="345" font-family="Arial" font-size="10" fill="#2e7d32" text-anchor="middle">Конституирует</text>
  </g>
  
  <!-- 2. Диалектическое единство - противоположности, образующие целое -->
  <g stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,3" marker-start="url(#circle)" marker-end="url(#circle)">
    <path d="M 335,600 L 665,600" fill="none"/>
    <text x="500" y="580" font-family="Arial" font-size="10" fill="#9c27b0" text-anchor="middle">Диалектическое единство</text>
    
    <path d="M 285,220 L 420,170" fill="none"/>
    <text x="350" y="180" font-family="Arial" font-size="10" fill="#9c27b0" text-anchor="middle">Диалектическое единство</text>
    
    <path d="M 715,220 L 580,170" fill="none"/>
    <text x="650" y="180" font-family="Arial" font-size="10" fill="#9c27b0" text-anchor="middle">Диалектическое единство</text>
    
    <path d="M 450,620 L 450,680" fill="none"/>
    <text x="420" y="650" font-family="Arial" font-size="10" fill="#9c27b0" text-anchor="middle">Диалектическое единство</text>
    
    <path d="M 550,620 L 550,680" fill="none"/>
    <text x="580" y="650" font-family="Arial" font-size="10" fill="#9c27b0" text-anchor="middle">Диалектическое единство</text>
  </g>
  
  <!-- 3. Герменевтическое отношение - интерпретирует, осмысляет -->
  <g stroke="#ff5722" stroke-width="2" stroke-dasharray="8,2" marker-end="url(#arrowhead)">
    <path d="M 180,480 L 275,570" fill="none"/>
    <text x="210" y="530" font-family="Arial" font-size="10" fill="#ff5722" text-anchor="middle">Интерпретирует</text>
    
    <path d="M 265,580 L 180,520" fill="none"/>
    <text x="205" y="560" font-family="Arial" font-size="10" fill="#ff5722" text-anchor="middle">Обогащает</text>
    
    <path d="M 180,485 L 420,635" fill="none"/>
    <text x="275" y="550" font-family="Arial" font-size="10" fill="#ff5722" text-anchor="middle">Интерпретирует</text>
  </g>
  
  <!-- 4. Методологическое обоснование - обеспечивает инструментами познания -->
  <g stroke="#1976d2" stroke-width="2" stroke-dasharray="4,2,1,2" marker-end="url(#arrowhead)">
    <path d="M 735,220 L 830,280" fill="none"/>
    <text x="795" y="235" font-family="Arial" font-size="10" fill="#1976d2" text-anchor="middle">Обосновывает</text>
    
    <path d="M 820,340 L 835,465" fill="none"/>
    <text x="810" y="400" font-family="Arial" font-size="10" fill="#1976d2" text-anchor="middle">Обосновывает</text>
    
    <path d="M 765,400 L 845,480" fill="none"/>
    <text x="795" y="450" font-family="Arial" font-size="10" fill="#1976d2" text-anchor="middle">Верифицирует</text>
    
    <path d="M 890,470 L 830,420" fill="none"/>
    <text x="875" y="435" font-family="Arial" font-size="10" fill="#1976d2" text-anchor="middle">Реализует</text>
  </g>
  
  <!-- 5. Историческая преемственность - обеспечивает развитие во времени -->
  <g stroke="#f57c00" stroke-width="2" stroke-dasharray="1,1" marker-end="url(#arrowhead)">
    <path d="M 300,560 L 300,450" fill="none"/>
    <text x="280" y="505" font-family="Arial" font-size="10" fill="#f57c00" text-anchor="middle">Определяет</text>
    
    <path d="M 335,580 L 425,625" fill="none"/>
    <text x="370" y="590" font-family="Arial" font-size="10" fill="#f57c00" text-anchor="middle">Формирует</text>
    
    <path d="M 470,625 L 320,570" fill="none"/>
    <text x="400" y="585" font-family="Arial" font-size="10" fill="#f57c00" text-anchor="middle">Обогащает</text>
    
    <path d="M 280,625 L 175,665" fill="none"/>
    <text x="220" y="655" font-family="Arial" font-size="10" fill="#f57c00" text-anchor="middle">Формирует</text>
    
    <path d="M 320,625 L 825,665" fill="none"/>
    <text x="575" y="675" font-family="Arial" font-size="10" fill="#f57c00" text-anchor="middle">Обеспечивает</text>
  </g>
  
  <!-- 6. Трансценденция - выход за пределы, преодоление границ -->
  <g stroke="#d32f2f" stroke-width="2" stroke-dasharray="6,2,2,2" marker-end="url(#arrowhead)">
    <path d="M 240,400 L 465,385" fill="none"/>
    <text x="350" y="380" font-family="Arial" font-size="10" fill="#d32f2f" text-anchor="middle">Трансцендирует</text>
    
    <path d="M 750,220 L 880,175" fill="none"/>
    <text x="825" y="185" font-family="Arial" font-size="10" fill="#d32f2f" text-anchor="middle">Реализуется в</text>
    
    <path d="M 170,315 L 130,195" fill="none"/>
    <text x="135" y="260" font-family="Arial" font-size="10" fill="#d32f2f" text-anchor="middle">Питается</text>
    
    <path d="M 730,580 L 830,630" fill="none"/>
    <text x="770" y="595" font-family="Arial" font-size="10" fill="#d32f2f" text-anchor="middle">Обеспечивает</text>
  </g>
  
  <!-- 7. Легитимация - обоснование права на существование -->
  <g stroke="#6a1b9a" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowhead)">
    <path d="M 150,300 L 250,370" fill="none"/>
    <text x="185" y="325" font-family="Arial" font-size="10" fill="#6a1b9a" text-anchor="middle">Легитимирует</text>
    
    <path d="M 115,330 L 115,400" fill="none"/>
    <text x="95" y="365" font-family="Arial" font-size="10" fill="#6a1b9a" text-anchor="middle">Обосновывает</text>
    
    <path d="M 125,270 L 260,215" fill="none"/>
    <text x="185" y="230" font-family="Arial" font-size="10" fill="#6a1b9a" text-anchor="middle">Легитимирует</text>
  </g>
  
  <!-- 8. Феноменологическая редукция - выявление сущностного -->
  <g stroke="#0097a7" stroke-width="2" stroke-dasharray="10,2" marker-end="url(#arrowhead)">
    <path d="M 500,450 L 500,500 L 665,585" fill="none"/>
    <text x="600" y="520" font-family="Arial" font-size="10" fill="#0097a7" text-anchor="middle">Редуцирует к</text>
    
    <path d="M 535,650 L 400,500 L 465,450" fill="none"/>
    <text x="450" y="500" font-family="Arial" font-size="10" fill="#0097a7" text-anchor="middle">Питает</text>
  </g>
  
  <!-- Легенда -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="230" height="120" fill="white" stroke="#333" stroke-width="1" opacity="0.9"/>
    <text x="10" y="20" font-family="Arial" font-size="12" font-weight="bold">Типы метафилософских связей:</text>
    
    <line x1="10" y1="35" x2="40" y2="35" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="45" y="38" font-family="Arial" font-size="10">Конституирование</text>
    
    <line x1="10" y1="50" x2="40" y2="50" stroke="#9c27b0" stroke-width="2" stroke-dasharray="5,3" marker-start="url(#circle)" marker-end="url(#circle)"/>
    <text x="45" y="53" font-family="Arial" font-size="10">Диалектическое единство</text>
    
    <line x1="10" y1="65" x2="40" y2="65" stroke="#ff5722" stroke-width="2" stroke-dasharray="8,2" marker-end="url(#arrowhead)"/>
    <text x="45" y="68" font-family="Arial" font-size="10">Герменевтическое отношение</text>
    
    <line x1="10" y1="80" x2="40" y2="80" stroke="#1976d2" stroke-width="2" stroke-dasharray="4,2,1,2" marker-end="url(#arrowhead)"/>
    <text x="45" y="83" font-family="Arial" font-size="10">Методологическое обоснование</text>
    
    <line x1="10" y1="95" x2="40" y2="95" stroke="#f57c00" stroke-width="2" stroke-dasharray="1,1" marker-end="url(#arrowhead)"/>
    <text x="45" y="98" font-family="Arial" font-size="10">Историческая преемственность</text>
    
    <line x1="10" y1="110" x2="40" y2="110" stroke="#d32f2f" stroke-width="2" stroke-dasharray="6,2,2,2" marker-end="url(#arrowhead)"/>
    <text x="45" y="113" font-family="Arial" font-size="10">Трансценденция</text>
  </g>
</svg>
