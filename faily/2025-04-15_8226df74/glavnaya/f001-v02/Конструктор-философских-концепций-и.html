                      }
                      
                      if (selectedCategories.matter && selectedCategories.form && selectedCategories.causality) {
                        implications.push("Натурфилософское следствие: Природа представляет собой единство материи и формы, подчиненное причинным законам, что созвучно аристотелевской онтологии.");
                      }
                      
                      if (selectedCategories.history && selectedCategories.teleology) {
                        implications.push("Историософское следствие: История имеет внутреннюю цель и направленность, что предполагает её телеологическое понимание.");
                      }
                      
                      return implications.length > 0 ? (
                        <ul className="list-disc pl-5 space-y-2">
                          {implications.map((implication, index) => (
                            <li key={index} className="conclusion-item">{implication}</li>
                          ))}
                        </ul>
                      ) : (
                        <p className="text-gray-500 italic">Выберите больше категорий, чтобы увидеть философские следствия вашей концепции.</p>
                      );
                    })()}
                  </div>
                </div>
              </div>
            </div>
          );
        };

        ReactDOM.render(
            <PhilosophyConceptExplorer />,
            document.getElementById('root')
        );
    </script>
</body>
</html>
