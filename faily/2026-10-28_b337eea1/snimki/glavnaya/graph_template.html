<style>
/* Layout: one-screen tool — a sidebar (search, card, legend) beside the graph; roots at the left, words to the right. */
:root {
  --bg: #eef1f4;
  --panel: #fbfcfd;
  --ink: #18212c;
  --muted: #5a6676;
  --line: #d3d9e1;
  --accent: #2c5a86;
  --focus: #18212c;

  --n-root: #a8780a;
  --n-root-soft: #a8780a66;
  --n-nq: #13738a;
  --n-ns: #3a8343;
  --n-np: #6a55b0;
  --n-form: #8893a2;

  --e-deriv: #3b679c;
  --e-element: #b9503f;
  --e-combine: #74852f;
  --e-see: #8893a2;
  --e-deprecated: #b98320;
  --e-cognate: #a8458a;
  --e-merged: #a8780a;
  --e-filed: #a8780a;
  --e-rootderiv: #a8780a;

  --warn: #a5541d;
  --ok: #2f7a45;

  --f-form: "Noto Serif", "DejaVu Serif", Georgia, serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161d; --panel: #171e27; --ink: #e3e8ef; --muted: #96a2b2; --line: #2a3441; --accent: #8db8e4; --focus: #f1f4f8;
    --n-root: #e2b34a; --n-root-soft: #e2b34a66; --n-nq: #49b6cc; --n-ns: #6dc07a; --n-np: #a593ea; --n-form: #7f8b9b;
    --e-deriv: #7ba7dc; --e-element: #e88371; --e-combine: #aabd5c; --e-see: #7f8b9b; --e-deprecated: #e2ad4c;
    --e-cognate: #dc7fc0; --e-merged: #e2b34a; --e-filed: #e2b34a; --e-rootderiv: #e2b34a;
    --warn: #ea9157; --ok: #6dc07a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161d; --panel: #171e27; --ink: #e3e8ef; --muted: #96a2b2; --line: #2a3441; --accent: #8db8e4; --focus: #f1f4f8;
  --n-root: #e2b34a; --n-root-soft: #e2b34a66; --n-nq: #49b6cc; --n-ns: #6dc07a; --n-np: #a593ea; --n-form: #7f8b9b;
  --e-deriv: #7ba7dc; --e-element: #e88371; --e-combine: #aabd5c; --e-see: #7f8b9b; --e-deprecated: #e2ad4c;
  --e-cognate: #dc7fc0; --e-merged: #e2b34a; --e-filed: #e2b34a; --e-rootderiv: #e2b34a;
  --warn: #ea9157; --ok: #6dc07a;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 14px; line-height: 1.45;
  overflow: hidden;
}
.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(300px, 360px) 1fr;
}
.side {
  min-width: 0;
  display: flex; flex-direction: column; gap: 14px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 16px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow-y: auto;
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 { margin: 0; font-family: var(--f-form); font-weight: 600; font-size: 20px; letter-spacing: .01em; text-wrap: balance; }
.brand .stat { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.search { display: flex; flex-direction: column; gap: 6px; position: relative; }
.search-row { display: flex; gap: 6px; }
input[type="search"], select {
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0;
}
input[type="search"] { flex: 1; }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.results {
  display: flex; flex-direction: column;
  border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
  max-height: 46vh; overflow-y: auto;
}
.results button {
  all: unset; cursor: pointer; display: block; padding: 6px 9px;
  border-bottom: 1px solid var(--line);
}
.results button:last-child { border-bottom: 0; }
.results button:hover, .results button:focus-visible { background: var(--bg); }
.results .none { padding: 8px 9px; color: var(--muted); }

.mk { color: var(--muted); font-family: var(--f-form); font-size: .92em; }
.fm { font-family: var(--f-form); font-style: italic; font-weight: 500; }
.root-fm { font-style: normal; font-weight: 600; }
.gl { color: var(--muted); }

.card { display: flex; flex-direction: column; gap: 10px; }
.card-head { display: flex; flex-direction: column; gap: 2px; }
.card-head .big { font-family: var(--f-form); font-size: 24px; line-height: 1.2; overflow-wrap: anywhere; }
.card .meta { color: var(--muted); font-size: 12.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.ok { color: var(--ok); border-color: currentColor; }
.tag.warn { color: var(--warn); border-color: currentColor; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
  font: inherit; font-size: 12.5px; cursor: pointer;
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
a.ext { color: var(--accent); font-size: 12.5px; }
.sec h3 {
  margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.links li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
.links .rel { font-size: 11.5px; padding: 0 6px; border-radius: 4px; border: 1px solid currentColor; }
.links button { all: unset; cursor: pointer; }
.links button:hover .fm, .links button:focus-visible .fm { text-decoration: underline; }
.written { flex-basis: 100%; padding-left: 12px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.more { color: var(--muted); font-size: 12px; }

.legend { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
.legend label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; }
.legend svg { flex: none; overflow: visible; }
.hint { color: var(--muted); font-size: 12px; }

.stage { position: relative; min-width: 0; min-height: 0; }
#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#graph:active { cursor: grabbing; }
.stage-tools {
  position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; gap: 6px;
}
.stage-note {
  position: absolute; left: 12px; bottom: max(10px, env(safe-area-inset-bottom, 0px));
  color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
}

.node text { font-family: var(--f-form); font-size: 12.5px; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
.node text .lm { fill: var(--muted); font-size: 11px; }
.node text .more { fill: var(--accent); font-family: var(--f-ui); font-size: 10.5px; }
.node { cursor: pointer; }
.node.sel .ring { stroke: var(--focus); }
.edge { fill: none; stroke-width: 1.5; }
.edge.nm { opacity: .45; }

@media (max-width: 760px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; grid-template-rows: auto 72svh; height: auto; }
  .side {
    border-right: 0; border-bottom: 1px solid var(--line); overflow: visible;
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <h1>Корни нео-эльдарина</h1>
      <div class="stat" id="stat"></div>
    </div>

    <div class="search">
      <div class="search-row">
        <input type="search" id="q" placeholder="Слово, корень или значение" autocomplete="off" spellcheck="false" aria-label="Поиск">
        <select id="scope" aria-label="Где искать">
          <option value="">всё</option>
          <option value="nq">ᴺQ.</option>
          <option value="ns">ᴺS.</option>

        </select>
      </div>

      </div>
      <p class="hint">Щелчок — карточка узла, двойной щелчок — развернуть соседей. Число «+N» у подписи — сколько связей узла ещё не показано. Колёсико и перетаскивание фона — масштаб и сдвиг.</p>
    </section>

  <main class="stage">

    <div class="stage-tools">

<script type="application/json" id="graph-data">/*GRAPH*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function () {
'use strict';
const G = JSON.parse(document.getElementById('graph-data').textContent);
const N = G.nodes.length;
const SITE = 'https://eldamo.org/content/words/word-';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------- vocabulary
const LANG = {
  q: ['Q.', 'Quenya'], mq: ['ᴹQ.', 'Middle Quenya'], eq: ['ᴱQ.', 'Early Quenya'], nq: ['ᴺQ.', 'Neo-Quenya'],
  s: ['S.', 'Sindarin'], n: ['N.', 'Noldorin'], en: ['ᴱN.', 'Early Noldorin'], g: ['G.', 'Gnomish'], ns: ['ᴺS.', 'Neo-Sindarin'],
  on: ['ON.', 'Old Noldorin'], os: ['OS.', 'Old Sindarin'], t: ['T.', 'Telerin'], mt: ['ᴹT.', 'Middle Telerin'], et: ['ᴱT.', 'Early Telerin'],
  ilk: ['Ilk.', 'Ilkorin'], eilk: ['ᴱIlk.', 'Early Ilkorin'], dan: ['Dan.', 'Danian'], nan: ['Nan.', 'Nandorin'],
  aq: ['AQ.', 'Ancient Quenya'], maq: ['ᴹAQ.', 'Middle Ancient Quenya'], at: ['AT.', 'Ancient Telerin'], van: ['Van.', 'Vanyarin'],
  norths: ['North S.', 'North Sindarin'], ad: ['Ad.', 'Adûnaic'], av: ['Av.', 'Avarin'], lem: ['Lem.', 'Lemberin'], lin: ['Lin.', 'Lindarin'],
  p: ['✶', 'Primitive Elvish'], mp: ['ᴹ✶', 'Middle Primitive Elvish'], ep: ['ᴱ✶', 'Early Primitive Elvish'], np: ['ᴺ✶', 'Neo-Primitive Elvish'],
};
const ROOT_MARK = { p: '√', mp: 'ᴹ√', ep: 'ᴱ√', np: 'ᴺ√' };
const REL = {
  deriv: ['деривация', 'выведено из'],
  element: ['элемент', 'составлено из'],
  combine: ['слияние форм', 'та же форма другой концепции (combine)'],
  see: ['см.', 'заглушка ссылается (see)'],
  deprecated: ['замена', 'заменённое слово (deprecated)'],
  cognate: ['когнат', 'когнат в другом языке'],
  merged: ['корень слит', 'корень другой концепции слит в этот'],
  filed: ['записан под', 'корень записан под этим'],
  rootderiv: ['корень из корня', 'корень выводится из корня'],
};
const WARN = {
  deprecated: 'заменён', deleted: 'вычеркнут', rejected: 'отвергнут', doubtful: 'сомнителен', unglossed: 'без значения', early: 'ранний',
};
const RULE = {
  deriv: 'названы деривацией', elements: 'по элементам', element: 'один элемент с корнем', intermediate: 'через промежуточную форму',
  combine: 'через слитую форму', see: 'через заглушку', deprecated: 'через заменённое слово', cognate: 'через когнат', self: 'сам корень',
};
const GROUP = { nq: 'перечень ᴺQ.', ns: 'перечень ᴺS.', np: 'перечень ᴺ✶' };
const SPEECH = {
  n: 'сущ.', adj: 'прил.', vb: 'гл.', adv: 'нареч.', pron: 'мест.', prep: 'предл.', conj: 'союз', interj: 'межд.',
  suf: 'суфф.', pref: 'преф.', cardinal: 'числ.', ordinal: 'порядк. числ.', particle: 'частица', infix: 'инфикс', fraction: 'дробь',
};

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const relName = k => G.rels[k];

// ---------------------------------------------------------------- the graph
const inE = Array.from({ length: N }, () => []);
const outE = Array.from({ length: N }, () => []);
G.edges.forEach((e, k) => { outE[e[0]].push(k); inE[e[1]].push(k); });
const indexOf = new Map(G.ids.map((x, i) => [x, i]));
const kindOf = i => G.nodes[i].k;
const isRoot = i => kindOf(i) === 'root';

function marker(i) {
  const n = G.nodes[i];
  if (n.k === 'root') return ROOT_MARK[n.l] || '√';
  return (LANG[n.l] || [n.l ? n.l.toUpperCase() + '.' : ''])[0];
}
function shown(i) {           // the NQ list shows its own spelling
  const n = G.nodes[i];
  return n.sp || n.f || '?';
}
function nodeColor(i) {
  const n = G.nodes[i];
  if (n.k === 'root') return css('--n-root');
  if (n.grp) return css('--n-' + n.grp);
  if (n.k === 'protoform') return css('--n-np');
  return css('--n-form');
}

// relations switched on in the legend
const relOn = Object.fromEntries(G.rels.map(r => [r, true]));
const edgeOn = k => relOn[relName(G.edges[k][2])];

// ---------------------------------------------------------------- state
const visible = new Set();
let focusNode = -1, selected = -1;
const pos = new Map();          // node -> {x, y, vx, vy, fx, fy}

function hiddenCount(i) {
  let h = 0;
  for (const k of inE[i]) if (edgeOn(k) && !visible.has(G.edges[k][0])) h++;
  for (const k of outE[i]) if (edgeOn(k) && !visible.has(G.edges[k][1])) h++;
  return h;
}

function upstream(i, cap) {
  const out = [i], seen = new Set([i]);
  for (let q = 0; q < out.length && out.length < cap; q++) {
    for (const k of inE[out[q]]) {
      if (!edgeOn(k)) continue;
      const a = G.edges[k][0];
      if (!seen.has(a)) { seen.add(a); out.push(a); }
    }
  }
  return out;
}
function downstream(i, depth, cap) {
  let layer = [i];
  const out = [], seen = new Set([i]);
  for (let d = 0; d < depth && layer.length; d++) {
    const next = [];
    for (const x of layer) {
      for (const k of outE[x]) {
        if (!edgeOn(k)) continue;
        const b = G.edges[k][1];
        if (seen.has(b)) continue;
        if (out.length >= cap) return out;
        seen.add(b); out.push(b); next.push(b);
      }
    }
    layer = next;
  }
  return out;
}

function focus(i, keep) {
  if (i < 0) return;
  if (!keep) { visible.clear(); pos.clear(); }
  focusNode = i;
  for (const x of upstream(i, 300)) visible.add(x);
  const down = isRoot(i) ? downstream(i, 2, 160) : downstream(i, 1, 40);
  for (const x of down) visible.add(x);
  select(i);
  try { history.replaceState(null, '', '#n-' + G.ids[i]); } catch (e) { /* the frame may refuse */ }
  render(true);
}
function expand(i) {
  const around = [];
  for (const k of inE[i]) if (edgeOn(k)) around.push(G.edges[k][0]);
  let added = 0;
  for (const k of outE[i]) {
    if (!edgeOn(k)) continue;
    if (added >= 80) break;
    const b = G.edges[k][1];
    if (!visible.has(b)) added++;
    around.push(b);
  }
  const p = pos.get(i);
  for (const x of around) {
    if (!visible.has(x) && p && !pos.has(x)) pos.set(x, { x: p.x + (Math.random() - .5) * 40, y: p.y + (Math.random() - .5) * 40 });
    visible.add(x);
  }
  render(false);
}
function removeNode(i) {
  if (i === focusNode) return;
  visible.delete(i); pos.delete(i);
  if (selected === i) select(focusNode);
  render(false);
}

// ---------------------------------------------------------------- layout and drawing
const svg = d3.select('#graph');
const root = svg.append('g');
const gEdges = root.append('g');
const gNodes = root.append('g');
const defs = svg.append('defs');
const zoom = d3.zoom().scaleExtent([0.08, 4]).on('zoom', ev => root.attr('transform', ev.transform));
svg.call(zoom).on('dblclick.zoom', null);

const DASH = { deriv: null, element: null, combine: '2 3', see: '1 3', deprecated: '6 4', cognate: '6 3 1 3', merged: '1 3', filed: '4 3', rootderiv: null };
function makeMarkers() {
  defs.selectAll('*').remove();
  for (const r of G.rels) {
    defs.append('marker').attr('id', 'arrow-' + r).attr('viewBox', '0 -4 8 8').attr('refX', 8).attr('refY', 0)
      .attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto')
      .append('path').attr('d', 'M0,-3.5L8,0L0,3.5Z').attr('fill', css('--e-' + r));
  }
}

const COL = 230;
let sim = null;

function ranks(nodes, edges) {
  const rank = new Map(nodes.map(i => [i, 0]));
  for (let it = 0; it < nodes.length && it < 40; it++) {
    let changed = false;
    for (const e of edges) {
      const r = rank.get(e.a) + 1;
      if (r > rank.get(e.b) && r < 40) { rank.set(e.b, r); changed = true; }
    }
    if (!changed) break;
  }
  return rank;
}

let fitPending = false;
function render(refit) {
  const nodes = [...visible];
  const edges = [];
  G.edges.forEach((e, k) => {
    if (visible.has(e[0]) && visible.has(e[1]) && relOn[relName(e[2])]) edges.push({ k, a: e[0], b: e[1], rel: relName(e[2]), x: e[3] || null });
  });
  const rank = ranks(nodes, edges);
  const data = nodes.map(i => {
    let p = pos.get(i);
    if (!p) { p = { x: rank.get(i) * COL + (Math.random() - .5) * 30, y: (Math.random() - .5) * 200 }; pos.set(i, p); }
    p.i = i; p.rank = rank.get(i);
    return p;
  });
  const byI = new Map(data.map(d => [d.i, d]));
  const links = edges.map(e => ({ ...e, source: byI.get(e.a), target: byI.get(e.b) }));

  // edges
  const es = gEdges.selectAll('path').data(links, d => d.k).join(
    enter => enter.append('path').attr('class', 'edge').call(p => p.append('title')));
  es.attr('stroke', d => css('--e-' + d.rel))
    .attr('stroke-dasharray', d => DASH[d.rel])
    .attr('stroke-width', d => d.rel === 'element' ? 2 : 1.5)
    .classed('nm', d => !!(d.x && d.x.nm))
    .attr('marker-end', d => `url(#arrow-${d.rel})`);
  es.select('title').text(d => {
    let t = `${REL[d.rel][1]}: ${marker(d.a)} ${shown(d.a)} → ${marker(d.b)} ${shown(d.b)}`;
    if (d.x && d.x.nm) t += '\nсогласные корня в слове не нашлись';
    for (const [src, chain] of (d.x && d.x.w) || []) t += `\nзаписано ${src}: ${chain.join(' > ')}`;
    return t;
  });

  // nodes
  const ns = gNodes.selectAll('g.node').data(data, d => d.i).join(enter => {
    const g = enter.append('g').attr('class', 'node');
    g.append('path').attr('class', 'ring');
    g.append('path').attr('class', 'shape');
    g.append('text').attr('x', 11).attr('dy', '0.35em');
    g.append('title');
    g.on('click', (ev, d) => { ev.stopPropagation(); select(d.i); })
      .on('dblclick', (ev, d) => { ev.stopPropagation(); select(d.i); expand(d.i); })
      .call(d3.drag()
        .on('start', (ev, d) => { if (!ev.active && sim) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
        .on('end', (ev, d) => { if (!ev.active && sim) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
    return g;
  });
  ns.classed('sel', d => d.i === selected);
  ns.select('.shape').attr('d', d => shapePath(d.i))
    .attr('fill', d => shapeFill(d.i)).attr('stroke', d => nodeColor(d.i))
    .attr('stroke-width', 1.6).attr('stroke-dasharray', d => G.nodes[d.i].k === 'root' && !G.nodes[d.i].rec ? '2 2' : null);
  ns.select('.ring').attr('d', d => d3.symbol(d3.symbolCircle, 520)())
    .attr('fill', 'none').attr('stroke-width', 2.2)
    .attr('stroke', d => d.i === selected ? css('--focus') : d.i === focusNode ? css('--accent') : 'none');
  ns.select('text').each(function (d) {
    const t = d3.select(this);
    t.selectAll('*').remove();
    t.append('tspan').attr('class', 'lm').text(marker(d.i) + (G.nodes[d.i].k === 'root' ? '' : ' '));
    t.append('tspan').attr('font-style', G.nodes[d.i].k === 'root' ? 'normal' : 'italic')
      .attr('font-weight', G.nodes[d.i].k === 'root' ? 600 : 500).text(shown(d.i));
    const h = hiddenCount(d.i);
    if (h) t.append('tspan').attr('class', 'more').text('  +' + h);
  });
  ns.select('title').text(d => `${marker(d.i)} ${shown(d.i)}${G.nodes[d.i].g ? ' “' + G.nodes[d.i].g + '”' : ''}`);

  // simulation: columns by rank, rows by force
  if (sim) sim.stop();
  sim = d3.forceSimulation(data)
    .force('x', d3.forceX(d => d.rank * COL).strength(0.9))
    .force('y', d3.forceY(0).strength(0.04))
    .force('link', d3.forceLink(links).distance(COL * 0.9).strength(0.12))
    .force('charge', d3.forceManyBody().strength(-90).distanceMax(400))
    .force('collide', d3.forceCollide(15))
    .on('tick', draw);
  fitPending = refit;
  if (reduced) { sim.stop(); for (let t = 0; t < 300; t++) sim.tick(); draw(); fitView(false); fitPending = false; }
  else sim.alpha(refit ? 1 : 0.5).restart().on('end', () => { if (fitPending) { fitView(true); fitPending = false; } });
  if (refit && !reduced) setTimeout(() => { if (fitPending) { fitView(true); fitPending = false; } }, 900);

  function draw() {
    es.attr('d', d => {
      const sx = d.source.x + 8, sy = d.source.y, tx = d.target.x - 9, ty = d.target.y;
      const mx = (sx + tx) / 2;
      return `M${sx},${sy}C${mx},${sy} ${mx},${ty} ${tx},${ty}`;
    });
    ns.attr('transform', d => `translate(${d.x},${d.y})`);
  }
  $('note').textContent = `на экране: ${data.length} узл. · ${links.length} связ.`;
}

function shapePath(i) {
  const n = G.nodes[i];
  if (n.k === 'root') return d3.symbol(d3.symbolDiamond, 150)();
  if (n.k === 'form') return d3.symbol(d3.symbolCircle, 70)();
  return d3.symbol(d3.symbolCircle, 120)();
}
function shapeFill(i) {
  const n = G.nodes[i];
  if (n.k === 'root') return n.rec ? css('--n-root') : css('--bg');
  if (n.k === 'protoform') return css('--bg');
  return nodeColor(i);
}

function fitView(animate) {
  const items = [...visible].map(i => pos.get(i)).filter(Boolean);
  if (!items.length) return;
  const box = svg.node().getBoundingClientRect();
  const xs = items.map(p => p.x), ys = items.map(p => p.y);
  const x0 = Math.min(...xs) - 30, x1 = Math.max(...xs) + 190, y0 = Math.min(...ys) - 30, y1 = Math.max(...ys) + 30;
  const k = Math.min(1.6, 0.92 * Math.min(box.width / (x1 - x0), box.height / (y1 - y0)));
  const t = d3.zoomIdentity.translate(box.width / 2 - k * (x0 + x1) / 2, box.height / 2 - k * (y0 + y1) / 2).scale(k);
  (animate ? svg.transition().duration(450) : svg).call(zoom.transform, t);
}
svg.on('click', () => {});
$('fit').addEventListener('click', () => fitView(!reduced));
$('relayout').addEventListener('click', () => { for (const i of visible) pos.delete(i); render(true); });

// ---------------------------------------------------------------- the card
function nodeButton(i) {
  const n = G.nodes[i];
  const cls = n.k === 'root' ? 'fm root-fm' : 'fm';
  return `<button type="button" data-node="${i}"><span class="mk">${esc(marker(i))}</span>${n.k === 'root' ? '' : ' '}<span class="${cls}">${esc(shown(i))}</span></button>`
    + (n.g ? ` <span class="gl">“${esc(n.g)}”</span>` : '');
}
function relTag(rel) {
  return `<span class="rel" style="color:${css('--e-' + rel)}">${esc(REL[rel][0])}</span>`;
}
function select(i) {
  selected = i;
  gNodes.selectAll('g.node').classed('sel', d => d.i === selected)
    .select('.ring').attr('stroke', d => d.i === selected ? css('--focus') : d.i === focusNode ? css('--accent') : 'none');
  const n = G.nodes[i];
  const id = G.ids[i];
  const lang = LANG[n.l] ? LANG[n.l][1] : n.l;
  const kind = n.k === 'root' ? 'корень' : n.k === 'protoform' ? 'праформа' : n.k === 'form' ? 'слово другого языка' : (n.l === 'p' || n.l === 'mp' || n.l === 'np') ? 'праэльфийское слово' : 'слово';
  const tags = [];
  if (n.grp) tags.push(`<span class="tag">${esc(GROUP[n.grp])}</span>`);
  if (n.s) tags.push(`<span class="tag">${esc(SPEECH[n.s] || n.s)}</span>`);
  if (n.k === 'word') tags.push(n.r ? `<span class="tag">корни: ${esc(RULE[n.r] || n.r)}</span>` : `<span class="tag warn">корень не найден</span>`);
  if (n.u) tags.push(`<span class="tag warn" title="в цепочке есть заменённое слово или когнат">непрямой путь</span>`);
  if (n.k === 'root' && n.rec === 1) tags.push(`<span class="tag ok">рекомендован</span>`);
  for (const w of n.wn || []) tags.push(`<span class="tag warn">⚠ ${esc(WARN[G.warn[w]])}</span>`);
  if (n.nl) tags.push(`<span class="tag" title="Eldamo не выводит этот корень в перечне roots-np">вне перечня</span>`);
  if (n.dc) tags.push(`<span class="tag">производных: ${n.dc}</span>`);

  let html = `<div class="card-head">
      <div class="big"><span class="mk">${esc(marker(i))}</span>${n.k === 'root' ? '' : ' '}<span class="${n.k === 'root' ? 'fm root-fm' : 'fm'}">${esc(shown(i))}</span></div>
      ${n.g ? `<div class="gl">“${esc(n.g)}”</div>` : ''}
      <div class="meta">${esc(kind)} · ${esc(lang)}${n.sp && n.sp !== n.f ? ` · в базе ${esc(n.f)}` : ''}</div>
    </div>
    <div class="tags">${tags.join('')}</div>`;
  if (n.ins && n.ins.length) {
    html += `<div class="sec"><h3>Вместо него Eldamo советует</h3><ul class="links">${n.ins.map(x => indexOf.has(x) ? `<li>${nodeButton(indexOf.get(x))}</li>` : '').join('')}</ul></div>`;
  }
  html += `<div class="actions">
      ${i !== focusNode ? `<button class="btn primary" type="button" data-act="focus">Сделать центром</button>` : ''}
      <button class="btn" type="button" data-act="expand">Развернуть соседей</button>
      ${i !== focusNode && visible.has(i) ? `<button class="btn" type="button" data-act="remove">Убрать с графа</button>` : ''}
      ${/^\d+$/.test(id) ? `<a class="ext" href="${SITE}${esc(id)}.html" target="_blank" rel="noopener">страница Eldamo ↗</a>` : ''}
    </div>`;

  const from = inE[i].map(k => G.edges[k]);
  if (from.length) {
    html += `<div class="sec"><h3>Происходит от</h3><ul class="links">${from.map(e => {
      const rel = relName(e[2]);
      const x = e[3] || {};
      const written = (x.w || []).map(([src, chain]) => `<span class="written">записано ${esc(src)}: ${esc(chain.join(' > '))}</span>`).join('');
      return `<li>${relTag(rel)} ${nodeButton(e[0])}${x.nm ? ' <span class="tag warn">согласные не сошлись</span>' : ''}${written}</li>`;
    }).join('')}</ul></div>`;
  }
  const to = outE[i].map(k => G.edges[k]);
  if (to.length) {
    const LIM = 60;
    html += `<div class="sec"><h3>Даёт (${to.length})</h3><ul class="links">${to.slice(0, LIM).map(e =>
      `<li>${relTag(relName(e[2]))} ${nodeButton(e[1])}</li>`).join('')}</ul>${to.length > LIM ? `<div class="more">и ещё ${to.length - LIM}; «Развернуть соседей» покажет их на графе</div>` : ''}</div>`;
  }
  $('card').innerHTML = html;
}
$('card').addEventListener('click', ev => {
  const b = ev.target.closest('[data-node]');
  if (b) {
    const i = +b.dataset.node;
    if (visible.has(i)) select(i); else focus(i);
    return;
  }
  const a = ev.target.closest('[data-act]');
  if (!a) return;
  if (a.dataset.act === 'focus') focus(selected);
  else if (a.dataset.act === 'expand') { if (!visible.has(selected)) focus(selected); else expand(selected); select(selected); }
  else if (a.dataset.act === 'remove') removeNode(selected);
});

// ---------------------------------------------------------------- search
const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[¹²³⁴⁵⁶⁷⁸⁹⁰√✶*!^#†()\-]/g, '').toLowerCase()
  .replace(/qu/g, 'q').replace(/c/g, 'k').replace(/ks/g, 'x');
let keys = null;
function searchKeys() {
  if (!keys) keys = G.nodes.map(n => [fold(n.f), fold(n.sp), (n.g || '').toLowerCase()]);
  return keys;
}
function search() {
  const raw = $('q').value.trim();
  const box = $('results');
  if (!raw) { box.hidden = true; return; }
  const q = fold(raw), ql = raw.toLowerCase(), scope = $('scope').value;
  const K = searchKeys();
  const hits = [];
  for (let i = 0; i < N; i++) {
    const n = G.nodes[i];
    if (scope === 'root' ? n.k !== 'root' : scope ? n.grp !== scope : !(n.grp || n.k === 'root')) continue;
    const [f, sp, g] = K[i];
    let s = -1;
    if (q && (f === q || sp === q)) s = 0;
    else if (q && (f.startsWith(q) || sp.startsWith(q))) s = 1;
    else if (g && g.split(/[^\p{L}]+/u).includes(ql)) s = 2;
    else if (q && f.includes(q)) s = 3;
    else if (g && g.includes(ql)) s = 4;
    if (s >= 0) hits.push([s, n.k === 'root' ? 1 : 0, f.length, i]);
  }
  hits.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  box.innerHTML = hits.slice(0, 40).map(([, , , i]) => {
    const n = G.nodes[i];
    return `<button type="button" data-hit="${i}"><span class="mk">${esc(marker(i))}</span>${n.k === 'root' ? '' : ' '}<span class="${n.k === 'root' ? 'fm root-fm' : 'fm'}">${esc(shown(i))}</span>`
      + `${n.g ? ` <span class="gl">“${esc(n.g)}”</span>` : ''}</button>`;
  }).join('') || `<div class="none">Ничего не найдено. Поиск идёт по формам без диакритики (alda, galad) и по английским значениям (tree).</div>`;
  box.hidden = false;
}
$('q').addEventListener('input', search);
$('scope').addEventListener('change', search);
$('results').addEventListener('click', ev => {
  const b = ev.target.closest('[data-hit]');
  if (!b) return;
  $('results').hidden = true;
  focus(+b.dataset.hit);
});
$('q').addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { const b = $('results').querySelector('[data-hit]'); if (b) { $('results').hidden = true; focus(+b.dataset.hit); } }
  if (ev.key === 'Escape') $('results').hidden = true;
});

// ---------------------------------------------------------------- legend
function legend() {
  const nodeItems = [
    ['слово ᴺQ.-перечня', d3.symbol(d3.symbolCircle, 120)(), css('--n-nq'), css('--n-nq'), null],
    ['слово ᴺS.-перечня', d3.symbol(d3.symbolCircle, 120)(), css('--n-ns'), css('--n-ns'), null],
    ['праэльфийское (ᴺ✶)', d3.symbol(d3.symbolCircle, 120)(), css('--n-np'), css('--n-np'), null],
    ['праформа вне перечней', d3.symbol(d3.symbolCircle, 120)(), css('--bg'), css('--n-np'), null],
    ['слово другого языка', d3.symbol(d3.symbolCircle, 70)(), css('--n-form'), css('--n-form'), null],
    ['корень рекомендованный', d3.symbol(d3.symbolDiamond, 150)(), css('--n-root'), css('--n-root'), null],
    ['корень с ⚠', d3.symbol(d3.symbolDiamond, 150)(), css('--bg'), css('--n-root'), '2 2'],
  ];
  $('legend-nodes').innerHTML = nodeItems.map(([label, d, fill, stroke, dash]) =>
    `<label><svg width="16" height="16" viewBox="-8 -8 16 16" aria-hidden="true"><path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="1.6"${dash ? ` stroke-dasharray="${dash}"` : ''}/></svg>${esc(label)}</label>`).join('');
  $('legend-edges').innerHTML = G.rels.map(r =>
    `<label title="${esc(REL[r][1])}"><input type="checkbox" id="rel-${r}" data-rel="${r}"${relOn[r] ? ' checked' : ''}>`
    + `<svg width="26" height="10" viewBox="0 0 26 10" aria-hidden="true"><line x1="1" y1="5" x2="25" y2="5" stroke="${css('--e-' + r)}" stroke-width="${r === 'element' ? 2 : 1.6}"${DASH[r] ? ` stroke-dasharray="${DASH[r]}"` : ''}/></svg>${esc(REL[r][0])}</label>`).join('');
}
$('legend-edges').addEventListener('change', ev => {
  const c = ev.target.closest('[data-rel]');
  if (!c) return;
  relOn[c.dataset.rel] = c.checked;
  render(false);
  if (selected >= 0) select(selected);
});

// theme changes recolor the drawing
function recolor() { makeMarkers(); legend(); if (visible.size) render(false); if (selected >= 0) select(selected); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', recolor);
new MutationObserver(recolor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------------------------------------------------------------- start
const words = G.nodes.filter(n => n.grp).length;
const rootsCount = G.nodes.filter(n => n.k === 'root').length;
$('stat').textContent = `Eldamo ${G.version} · ${words.toLocaleString('ru-RU')} слов трёх перечней · ${rootsCount.toLocaleString('ru-RU')} корней · ${G.edges.length.toLocaleString('ru-RU')} связей`;
makeMarkers();
legend();
function fromHash() {
  const m = /^#n-(\w+)$/.exec(location.hash);
  return m && indexOf.has(m[1]) ? indexOf.get(m[1]) : -1;
}
window.addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== focusNode) focus(i); });
const start = fromHash();
focus(start >= 0 ? start : indexOf.get('539805327'));     // Q. alda
})();
</script>
