<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кузница Феанора: Расширенная версия</title>
    <style>
        /* Сохраняем все существующие стили */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Crimson Text', serif;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e);
            color: #e8e8e8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .game-container {
            max-width: 900px;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #444;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(100, 150, 255, 0.3);
        }
        
        h1 {
            font-family: 'Cinzel', serif;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .stats-block {
            background: rgba(20, 20, 40, 0.6);
            border: 1px solid #444;
            border-radius: 10px;
            padding: 15px;
        }
        
        .stats-block h3 {
            font-family: 'Cinzel', serif;
            color: #87ceeb;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        
        .stat-line {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 1.1em;
        }
        
        .stat-value {
            color: #ffd700;
            font-weight: bold;
        }
        
        .game-text {
            background: rgba(10, 10, 20, 0.6);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            min-height: 200px;
            line-height: 1.8;
            font-size: 1.15em;
        }
        
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .choice-btn {
            background: linear-gradient(135deg, #1a237e, #283593);
            border: 2px solid #3949ab;
            color: #e8e8e8;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05em;
            font-family: 'Crimson Text', serif;
            transition: all 0.3s ease;
            text-align: left;
        }
        
        .choice-btn:hover {
            background: linear-gradient(135deg, #283593, #3949ab);
            border-color: #5c6bc0;
            box-shadow: 0 0 15px rgba(92, 107, 192, 0.4);
            transform: translateX(5px);
        }
        
        .materials-display {
            background: rgba(40, 20, 0, 0.4);
            border: 1px solid #8b4513;
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            font-style: italic;
            color: #daa520;
        }
        
        .event-warning {
            color: #ff6b6b;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            font-size: 1.1em;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .special-event {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(135, 206, 235, 0.1));
            border: 1px solid #ffd700;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
            50% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
        }
        
        .ending-text {
            font-size: 1.2em;
            line-height: 1.8;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        
        .restart-btn {
            display: block;
            margin: 30px auto 0;
            background: linear-gradient(135deg, #ff6b00, #ff8800);
            border: 2px solid #ffa500;
            color: white;
            padding: 15px 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
            font-family: 'Cinzel', serif;
            transition: all 0.3s ease;
        }
        
        .restart-btn:hover {
            background: linear-gradient(135deg, #ff8800, #ffaa00);
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.5);
        }
        
        .reaction-text {
            background: linear-gradient(135deg, rgba(75, 0, 130, 0.2), rgba(138, 43, 226, 0.1));
            border-left: 4px solid #9370db;
            padding: 20px;
            margin: 15px 0;
            font-style: italic;
            font-size: 1.1em;
            line-height: 1.6;
            color: #e8d4ff;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(147, 112, 219, 0.3);
        }

        .progress-indicator {
            background: rgba(30, 30, 50, 0.6);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            text-align: center;
            color: #87ceeb;
            font-family: 'Cinzel', serif;
        }
        
        .interlude-event {
            background: linear-gradient(135deg, rgba(100, 50, 200, 0.1), rgba(50, 150, 200, 0.1));
            border: 2px dashed #9370db;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Кузница Феанора</h1>
        
        <div class="progress-indicator" id="progressBar">
            Глава <span id="chapterNum">1</span> из <span id="totalChapters">?</span>: <span id="chapterName">Начало</span>
        </div>
        
        <div class="stats-container">
            <div class="stats-block">
                <h3>Феанор</h3>
                <div class="stat-line">
                    <span>Мудрость:</span>
                    <span class="stat-value" id="wisdom">50</span>
                </div>
                <div class="stat-line">
                    <span>Мастерство:</span>
                    <span class="stat-value" id="skill">70</span>
                </div>
                <div class="stat-line">
                    <span>Гордость:</span>
                    <span class="stat-value" id="pride">60</span>
                </div>
            </div>
            
            <div class="stats-block">
                <h3>Сильмариллы</h3>
                <div class="stat-line">
                    <span>Свет:</span>
                    <span class="stat-value" id="light">0</span>
                </div>
                <div class="stat-line">
                    <span>Чистота:</span>
                    <span class="stat-value" id="purity">0</span>
                </div>
                <div class="stat-line">
                    <span>Сила:</span>
                    <span class="stat-value" id="power">0</span>
                </div>
            </div>
        </div>
        
        <div class="game-text" id="gameText">
            Загрузка...
        </div>
        
        <div class="choices-container" id="choices">
        </div>
    </div>
    
    <script>
        const gameState = {
            stage: 0,
            substage: 0, // Новое: подэтапы
            chapter: 1,   // Новое: главы
            eventCounter: 0, // Новое: счетчик событий
            feanor: {
                wisdom: 50,
                skill: 70,
                pride: 60
            },
            silmarils: {
                light: 0,
                purity: 0,
                power: 0
            },
            materials: [],
            choices: {
                helpFromValar: null,
                melkorRelation: null,
                familySupport: null,
                method: null
            },
            events: [],
            chainEvents: [], // Новое: цепные события
            triggers: []     // Новое: триггеры для событий
        };

        // Новая система: промежуточные события между основными этапами
        const interludeEvents = {
            afterStage1: [
                {
                    condition: () => gameState.choices.melkorRelation === 'allied',
                    text: "Ночью ты чувствуешь странное присутствие. Тень Мелькора всё ещё витает в кузнице, оставляя странные знаки на стенах.",
                    choices: [
                        {
                            text: "Изучить знаки",
                            effect: () => {
                                gameState.feanor.skill += 5;
                                gameState.silmarils.power += 5;
                                gameState.events.push('shadow_signs');
                            }
                        },
                        {
                            text: "Стереть их святой водой",
                            effect: () => {
                                gameState.silmarils.purity += 5;
                                gameState.feanor.wisdom += 3;
                            }
                        }
                    ]
                },
                {
                    condition: () => gameState.choices.melkorRelation === 'enemy',
                    text: "На рассвете прилетает орёл от Манвэ с благодарностью за твою стойкость против Тьмы. В клюве - маленький флакон со светом первых звёзд.",
                    choices: [
                        {
                            text: "Добавить свет к материалам",
                            effect: () => {
                                gameState.materials.push('first_starlight');
                                gameState.silmarils.light += 8;
                            }
                        },
                        {
                            text: "Сохранить на потом",
                            effect: () => {
                                gameState.feanor.wisdom += 5;
                                gameState.triggers.push('has_starlight');
                            }
                        }
                    ]
                },
                {
                    condition: () => true, // Всегда может произойти
                    text: "Странный сон посещает тебя: ты видишь три пути создания Сильмариллов - путь Света, путь Силы и путь Гармонии. Какой выберешь?",
                    choices: [
                        {
                            text: "Путь Света",
                            effect: () => {
                                gameState.silmarils.light += 10;
                                gameState.chainEvents.push('path_of_light');
                            }
                        },
                        {
                            text: "Путь Силы", 
                            effect: () => {
                                gameState.silmarils.power += 10;
                                gameState.chainEvents.push('path_of_power');
                            }
                        },
                        {
                            text: "Путь Гармонии",
                            effect: () => {
                                gameState.silmarils.light += 5;
                                gameState.silmarils.power += 5;
                                gameState.silmarils.purity += 5;
                                gameState.chainEvents.push('path_of_harmony');
                            }
                        }
                    ]
                }
            ],
            afterStage3: [
                {
                    condition: () => gameState.choices.familySupport === true,
                    text: "Твой сын Маэдрос приносит древний том из библиотеки. 'Отец, я нашёл записи о Первом Кузнеце, который ковал до прихода Валар!'",
                    choices: [
                        {
                            text: "Изучить том вместе",
                            effect: () => {
                                gameState.feanor.skill += 8;
                                gameState.feanor.wisdom += 5;
                                gameState.events.push('ancient_knowledge');
                            }
                        },
                        {
                            text: "Попросить сына применить знания",
                            effect: () => {
                                gameState.silmarils.power += 10;
                                gameState.chainEvents.push('son_helps_craft');
                            }
                        }
                    ]
                }
            ]
        };

        // Новая система: мини-события, срабатывающие по триггерам
        const triggeredEvents = [
            {
                trigger: 'has_starlight',
                stage: 5, // Сработает на этапе 5
                text: "Сохранённый свет первых звёзд начинает резонировать с Сильмариллами!",
                choices: [
                    {
                        text: "Использовать резонанс",
                        effect: () => {
                            gameState.silmarils.light += 15;
                            gameState.silmarils.purity += 10;
                        }
                    }
                ]
            },
            {
                trigger: 'path_of_light',
                stage: 'any', // Может сработать на любом этапе
                chance: 0.3, // 30% шанс
                text: "Путь Света манифестируется! Аура чистого сияния окружает кузницу.",
                choices: [
                    {
                        text: "Впитать сияние",
                        effect: () => {
                            gameState.silmarils.light += 12;
                        }
                    }
                ]
            }
        ];

        // Расширенная система цепных событий
        const chainEventSequences = {
            'son_helps_craft': [
                {
                    text: "Куруфин, вдохновлённый примером брата, приносит свои чертежи улучшений.",
                    choices: [
                        {
                            text: "Воплотить идеи Куруфина",
                            effect: () => {
                                gameState.feanor.skill += 10;
                                gameState.silmarils.power += 8;
                            },
                            nextChain: 'all_sons_help'
                        },
                        {
                            text: "Объединить идеи обоих сыновей",
                            effect: () => {
                                gameState.silmarils.light += 6;
                                gameState.silmarils.power += 6;
                                gameState.silmarils.purity += 6;
                            }
                        }
                    ]
                },
                {
                    chainId: 'all_sons_help',
                    text: "Все семеро сыновей собираются в кузнице! Каждый приносит свой дар.",
                    choices: [
                        {
                            text: "Принять все дары",
                            effect: () => {
                                gameState.silmarils.light += 14;
                                gameState.silmarils.power += 14;
                                gameState.silmarils.purity += 14;
                                gameState.events.push('seven_sons_blessing');
                            }
                        }
                    ]
                }
            ]
        };

        // Функция для получения случайного промежуточного события
        function getInterludeEvent(afterStage) {
            const events = interludeEvents[`afterStage${afterStage}`];
            if (!events) return null;
            
            const validEvents = events.filter(e => e.condition());
            if (validEvents.length === 0) return null;
            
            return validEvents[Math.floor(Math.random() * validEvents.length)];
        }

        // Функция для обработки цепных событий
        function processChainEvent() {
            if (gameState.chainEvents.length === 0) return null;
            
            const chainId = gameState.chainEvents.shift();
            const sequence = chainEventSequences[chainId];
            if (!sequence || sequence.length === 0) return null;
            
            return sequence[0];
        }

        // Функция для проверки триггерных событий
        function checkTriggeredEvents(stage) {
            for (const event of triggeredEvents) {
                if (!gameState.triggers.includes(event.trigger)) continue;
                if (event.stage !== 'any' && event.stage !== stage) continue;
                if (event.chance && Math.random() > event.chance) continue;
                
                // Удаляем использованный триггер
                const index = gameState.triggers.indexOf(event.trigger);
                gameState.triggers.splice(index, 1);
                
                return event;
            }
            return null;
        }

        // Модифицированная функция перехода между этапами
        function transitionToNextStage(nextStageId) {
            gameState.eventCounter++;
            
            // Проверяем цепные события
            const chainEvent = processChainEvent();
            if (chainEvent) {
                renderSpecialEvent(chainEvent, () => transitionToNextStage(nextStageId));
                return;
            }
            
            // Проверяем триггерные события
            const triggeredEvent = checkTriggeredEvents(gameState.stage);
            if (triggeredEvent) {
                renderSpecialEvent(triggeredEvent, () => transitionToNextStage(nextStageId));
                return;
            }
            
            // Проверяем промежуточные события (с вероятностью)
            if (Math.random() > 0.4) { // 60% шанс промежуточного события
                const interlude = getInterludeEvent(gameState.stage);
                if (interlude) {
                    renderSpecialEvent(interlude, () => transitionToNextStage(nextStageId));
                    return;
                }
            }
            
            // Добавляем случайное мини-событие между основными этапами (30% шанс)
            if (Math.random() > 0.7 && gameState.eventCounter < 25) {
                const miniEvent = getRandomMiniEvent();
                renderSpecialEvent(miniEvent, () => transitionToNextStage(nextStageId));
                return;
            }
            
            // Переход к следующему основному этапу
            renderStage(nextStageId);
        }

        // Функция для отображения специальных событий
        function renderSpecialEvent(event, onComplete) {
            const textDiv = document.getElementById('gameText');
            const choicesDiv = document.getElementById('choices');
            
            textDiv.innerHTML = `<div class="interlude-event">${event.text}</div>`;
            choicesDiv.innerHTML = '';
            
            event.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice.text;
                btn.onclick = () => {
                    if (choice.effect) choice.effect();
                    if (choice.nextChain) {
                        gameState.chainEvents.push(choice.nextChain);
                    }
                    updateStats();
                    onComplete();
                };
                choicesDiv.appendChild(btn);
            });
        }

        // Генератор мини-событий
        function getRandomMiniEvent() {
            const miniEvents = [
                {
                    text: "Внезапно! Птица Йаванны влетает в окно, роняя семя неизвестного растения прямо в плавильню!",
                    choices: [
                        {
                            text: "Позволить семени прорасти",
                            effect: () => {
                                gameState.silmarils.purity += 7;
                                gameState.events.push('nature_blessing');
                            }
                        },
                        {
                            text: "Извлечь и сохранить",
                            effect: () => {
                                gameState.feanor.wisdom += 5;
                                gameState.materials.push('mystery_seed');
                            }
                        }
                    ]
                },
                {
                    text: "Тихий стук в дверь. Это Эльве Тингол из Дориата! 'Слышал о твоём труде, кузен. Принёс дар из моих чертогов.'",
                    choices: [
                        {
                            text: "Принять дар с благодарностью",
                            effect: () => {
                                gameState.materials.push('doriath_gift');
                                gameState.silmarils.purity += 8;
                            }
                        },
                        {
                            text: "Обменять знаниями",
                            effect: () => {
                                gameState.feanor.skill += 7;
                                gameState.feanor.wisdom += 7;
                            }
                        }
                    ]
                },
                {
                    text: "Метеоритный дождь начинается прямо над Валинором! Осколки падают вокруг кузницы.",
                    choices: [
                        {
                            text: "Собрать метеориты",
                            effect: () => {
                                gameState.materials.push('meteor_fragments');
                                gameState.silmarils.power += 9;
                            }
                        },
                        {
                            text: "Использовать их энергию падения",
                            effect: () => {
                                gameState.silmarils.light += 11;
                                gameState.silmarils.power += 6;
                            }
                        }
                    ]
                }
            ];
            
            return miniEvents[Math.floor(Math.random() * miniEvents.length)];
        }

        // Обновленная функция updateStats с индикатором прогресса
        function updateStats() {
            document.getElementById('wisdom').textContent = gameState.feanor.wisdom;
            document.getElementById('skill').textContent = gameState.feanor.skill;
            document.getElementById('pride').textContent = gameState.feanor.pride;
            document.getElementById('light').textContent = gameState.silmarils.light;
            document.getElementById('purity').textContent = gameState.silmarils.purity;
            document.getElementById('power').textContent = gameState.silmarils.power;
            
            // Обновляем прогресс
            document.getElementById('chapterNum').textContent = gameState.chapter;
            document.getElementById('totalChapters').textContent = '15-25';
            
            const chapterNames = [
                "Начало", "Встреча с Тьмой", "Сбор Материалов", "Семейные Узы",
                "Свет Древ", "Испытание Валар", "Методы Ковки", "Неожиданности",
                "Промежуточный Этап", "Кризис", "Откровение", "Финальная Ковка",
                "Последние Штрихи", "Судьбоносный Выбор", "Эпилог"
            ];
            
            const chapterName = chapterNames[Math.min(gameState.chapter - 1, chapterNames.length - 1)];
            document.getElementById('chapterName').textContent = chapterName;
        }

        // Модифицируем функцию renderStage
        function renderStage(stageId) {
            const stage = stages.find(s => s.id === stageId);
            const textDiv = document.getElementById('gameText');
            const choicesDiv = document.getElementById('choices');
            
            gameState.chapter = Math.min(gameState.chapter + 1, 15);
            updateStats();
            
            if (!stage) {
                // Добавляем дополнительные случайные события перед концовкой
                if (gameState.eventCounter < 18 && Math.random() > 0.3) {
                    const bonusEvent = getRandomComplexEvent();
                    renderSpecialEvent(bonusEvent, () => renderEnding());
                    return;
                }
                renderEnding();
                return;
            }
            
            let stageText, stageChoices;
            
            // Обработка динамических стадий
            if (stage.dynamicStage && stage.getContent) {
                const content = stage.getContent();
                stageText = content.text;
                stageChoices = content.choices;
            } else {
                stageText = typeof stage.text === 'function' ? stage.text() : stage.text;
                stageChoices = stage.choices;
            }
            
            textDiv.innerHTML = stageText;
            
            if (gameState.materials.length > 0) {
                const materialNames = {
                    'telperion_dew': 'Роса Телпериона',
                    'star_dust': 'Звёздная пыль Варды',
                    'adamant': 'Адамант глубин',
                    'trinity': 'Триединый сплав',
                    'nienna_tear': 'Слеза Ниэнны',
                    'primordial_darkness': 'Осколок Первозданной Тьмы',
                    'master_alloy': 'Мастерский сплав',
                    'comet_dust': 'Кометная пыль',
                    'first_starlight': 'Свет первых звёзд',
                    'mystery_seed': 'Таинственное семя',
                    'doriath_gift': 'Дар Дориата',
                    'meteor_fragments': 'Осколки метеорита'
                };
                const materials = gameState.materials.map(m => materialNames[m] || m).join(', ');
