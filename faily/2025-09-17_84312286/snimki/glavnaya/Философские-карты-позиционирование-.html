        }

            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .chart-selector {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .chart-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .chart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        .chart-btn.active {
            background: linear-gradient(135deg, #764ba2, #667eea);
            transform: scale(1.05);
        }
        
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 700px;
            margin: 0 auto 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        
        .chart-title {
            text-align: center;
            color: #555;
            margin-bottom: 20px;
            font-size: 1.5em;
            font-weight: 600;
        }
        
        svg {
            width: 100%;
            height: calc(100% - 50px);
        }
        
        .axis {
            stroke: #666;
            stroke-width: 2;
        }
        
        .axis-label {
            fill: #333;
            font-size: 14px;
            font-weight: 600;
        }
        
        .grid-line {
            stroke: #e0e0e0;
            stroke-width: 0.5;
            stroke-dasharray: 2,2;
        }
        
        .philosopher-point {
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .philosopher-point:hover {
            transform: scale(1.5);
        }
        
        .philosopher-label {
            fill: #333;
            font-size: 11px;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .philosopher-label.highlight {
            font-weight: 600;
            opacity: 1;
            fill: #764ba2;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 10px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .legend-text {
            font-size: 12px;
            color: #555;
        }

        const colors = {

        };
        
        const eraNames = {
            ancient: 'Античность',
            medieval: 'Средневековье',
            modern: 'Новое время',
            german: 'Немецкий идеализм',
            contemporary: 'Современность'
        };
        
        let currentChart = 0;
        
        function showChart(index) {
            currentChart = index;
            
            // Update buttons
            document.querySelectorAll('.chart-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            
            // Draw chart
            drawChart(charts[index]);
        }
        
        function drawChart(chart) {
            const svg = document.getElementById('chart');
            const tooltip = document.getElementById('tooltip');
            
            // Clear SVG
            svg.innerHTML = '';
            
            // Set title
            document.getElementById('chartTitle').textContent = chart.title;
            
            // Get dimensions
            const width = svg.clientWidth;
            const height = svg.clientHeight;
            const padding = 60;
            
            // Create scales
            const xScale = (x) => padding + (x + 10) * (width - 2 * padding) / 20;
            const yScale = (y) => height - padding - (y + 10) * (height - 2 * padding) / 20;
            
            // Draw grid
            for (let i = -10; i <= 10; i += 5) {
                // Vertical lines
                const x = xScale(i);
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x);
                line.setAttribute('y1', padding);
                line.setAttribute('x2', x);
                line.setAttribute('y2', height - padding);
                line.setAttribute('class', 'grid-line');
                svg.appendChild(line);
                
                // Horizontal lines
                const y = yScale(i);
                const hline = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                hline.setAttribute('x1', padding);
                hline.setAttribute('y1', y);
                hline.setAttribute('x2', width - padding);
                hline.setAttribute('y2', y);
                hline.setAttribute('class', 'grid-line');
                svg.appendChild(hline);
            }
            
            // Draw axes
            // X-axis
            const xAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            xAxis.setAttribute('x1', padding);
            xAxis.setAttribute('y1', yScale(0));
            xAxis.setAttribute('x2', width - padding);
            xAxis.setAttribute('y2', yScale(0));
            xAxis.setAttribute('class', 'axis');
            svg.appendChild(xAxis);
            
            // Y-axis
            const yAxis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            yAxis.setAttribute('x1', xScale(0));
            yAxis.setAttribute('y1', padding);
            yAxis.setAttribute('x2', xScale(0));
            yAxis.setAttribute('y2', height - padding);
            yAxis.setAttribute('class', 'axis');
            svg.appendChild(yAxis);
            
            // Add axis labels
            // Left label
            const leftLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            leftLabel.setAttribute('x', padding - 10);
            leftLabel.setAttribute('y', yScale(0) - 10);
            leftLabel.setAttribute('text-anchor', 'end');
            leftLabel.setAttribute('class', 'axis-label');
            leftLabel.textContent = chart.xAxis.left;
            svg.appendChild(leftLabel);
            
            // Right label
            const rightLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            rightLabel.setAttribute('x', width - padding + 10);
            rightLabel.setAttribute('y', yScale(0) - 10);
            rightLabel.setAttribute('text-anchor', 'start');
            rightLabel.setAttribute('class', 'axis-label');
            rightLabel.textContent = chart.xAxis.right;
            svg.appendChild(rightLabel);
            
            // Bottom label
            const bottomLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            bottomLabel.setAttribute('x', xScale(0) + 10);
            bottomLabel.setAttribute('y', height - padding + 20);
            bottomLabel.setAttribute('text-anchor', 'start');
            bottomLabel.setAttribute('class', 'axis-label');
            bottomLabel.textContent = chart.yAxis.bottom;
            svg.appendChild(bottomLabel);
            
            // Top label
            const topLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            topLabel.setAttribute('x', xScale(0) + 10);
            topLabel.setAttribute('y', padding - 10);
            topLabel.setAttribute('text-anchor', 'start');
            topLabel.setAttribute('class', 'axis-label');
            topLabel.textContent = chart.yAxis.top;
            svg.appendChild(topLabel);
            
            // Plot philosophers
            chart.philosophers.forEach(phil => {
                const x = xScale(phil.x);
                const y = yScale(phil.y);
                
                // Create point
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', x);
                circle.setAttribute('cy', y);
                circle.setAttribute('r', 6);
                circle.setAttribute('fill', colors[phil.era]);
                circle.setAttribute('class', 'philosopher-point');
                circle.setAttribute('data-name', phil.name);
                
                // Add hover events
                circle.addEventListener('mouseenter', (e) => {
                    tooltip.innerHTML = `<strong>${phil.name}</strong><br>${phil.desc}<br><small>${eraNames[phil.era]}</small>`;
                    tooltip.style.opacity = '1';
                    tooltip.style.left = e.pageX + 10 + 'px';
                    tooltip.style.top = e.pageY - 30 + 'px';
                    
                    // Highlight label
                    const label = svg.querySelector(`text[data-name="${phil.name}"]`);
                    if (label) label.classList.add('highlight');
                });
                
                circle.addEventListener('mousemove', (e) => {
                    tooltip.style.left = e.pageX + 10 + 'px';
                    tooltip.style.top = e.pageY - 30 + 'px';
                });
                
                circle.addEventListener('mouseleave', () => {
                    tooltip.style.opacity = '0';
                    const label = svg.querySelector(`text[data-name="${phil.name}"]`);
                    if (label) label.classList.remove('highlight');
                });
                
                svg.appendChild(circle);
                
                // Create label
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', x);
                text.setAttribute('y', y - 8);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('class', 'philosopher-label');
                text.setAttribute('data-name', phil.name);
                text.textContent = phil.name;
                svg.appendChild(text);
            });
            
            // Update legend
            updateLegend();
        }
        
        function updateLegend() {
            const legend = document.getElementById('legend');
            legend.innerHTML = '';
            
            Object.entries(eraNames).forEach(([key, name]) => {
                const item = document.createElement('div');
                item.className = 'legend-item';
                
                const color = document.createElement('div');
                color.className = 'legend-color';
                color.style.backgroundColor = colors[key];
                
                const text = document.createElement('span');
                text.className = 'legend-text';
                text.textContent = name;
                
                item.appendChild(color);
                item.appendChild(text);
                legend.appendChild(item);
            });
        }
        
        // Initialize
        showChart(0);
        
        // Make chart responsive
        window.addEventListener('resize', () => {
            drawChart(charts[currentChart]);
        });
