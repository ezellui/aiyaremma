
<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Стили -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <linearGradient id="db-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>
    <linearGradient id="service-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e3f2fd" />
      <stop offset="100%" stop-color="#bbdefb" />
    </linearGradient>
    <linearGradient id="claude-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9" />
      <stop offset="100%" stop-color="#c8e6c9" />
    </linearGradient>
    <linearGradient id="ui-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0" />
      <stop offset="100%" stop-color="#ffe0b2" />
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="1000" height="800" fill="#ffffff"/>
  
  <!-- Заголовок -->
  <text x="500" y="40" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Архитектурная схема философского сервиса</text>

  <!-- Блок баз данных -->
  <rect x="50" y="80" width="240" height="670" rx="10" ry="10" fill="#f9f9f9" stroke="#ddd" stroke-width="2"/>
  <text x="170" y="110" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Базы данных</text>
  
  <!-- Отдельные базы данных -->
  <rect x="70" y="130" width="200" height="70" rx="5" ry="5" fill="url(#db-gradient)" stroke="#bbb" stroke-width="1"/>
  <text x="170" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">База пользователей</text>
  <text x="170" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">User profiles, preferences, history</text>
  
  <rect x="70" y="210" width="200" height="70" rx="5" ry="5" fill="url(#db-gradient)" stroke="#bbb" stroke-width="1"/>
  <text x="170" y="245" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">База философских категорий</text>
  <text x="170" y="265" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Predefined and custom categories</text>
  
  <rect x="70" y="290" width="200" height="70" rx="5" ry="5" fill="url(#db-gradient)" stroke="#bbb" stroke-width="1"/>
  <text x="170" y="325" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">База связей</text>
  <text x="170" y="345" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Relationship types and instances</text>
  
  <rect x="70" y="370" width="200" height="70" rx="5" ry="5" fill="url(#db-gradient)" stroke="#bbb" stroke-width="1"/>
  <text x="170" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">База графов концепций</text>
  <text x="170" y="425" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Concept graphs with metadata</text>
  
  <rect x="70" y="450" width="200" height="70" rx="5" ry="5" fill="url(#db-gradient)" stroke="#bbb" stroke-width="1"/>
  <text x="170" y="485" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">База тезисов</text>
  <text x="170" y="505" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Theses linked to graph elements</text>
  
  <rect x="70" y="530" width="200" height="70" rx="5" ry="5" fill="url(#db-gradient)" stroke="#bbb" stroke-width="1"/>
  <text x="170" y="565" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">База синтезов</text>
  <text x="170" y="585" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Synthesized concepts and metadata</text>
  
  <rect x="70" y="610" width="200" height="70" rx="5" ry="5" fill="url(#db-gradient)" stroke="#bbb" stroke-width="1"/>
  <text x="170" y="645" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">База исторических концепций</text>
  <text x="170" y="665" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Predefined philosophical concepts</text>

  <!-- Claude API -->
  <rect x="500" y="80" width="200" height="100" rx="10" ry="10" fill="url(#claude-gradient)" stroke="#66bb6a" stroke-width="2"/>
  <text x="600" y="130" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Claude 3.7 API</text>
  
  <!-- Сервисные модули -->
  <rect x="350" y="230" width="500" height="450" rx="10" ry="10" fill="#f0f7ff" stroke="#ddd" stroke-width="2"/>
  <text x="600" y="260" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Сервисные модули</text>
  
  <!-- Отдельные сервисы -->
  <rect x="370" y="280" width="220" height="80" rx="5" ry="5" fill="url(#service-gradient)" stroke="#90caf9" stroke-width="1"/>
  <text x="480" y="315" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Модуль интеграции с Claude</text>
  <text x="480" y="335" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">API клиент, форматирование запросов</text>
  
  <rect x="370" y="370" width="220" height="80" rx="5" ry="5" fill="url(#service-gradient)" stroke="#90caf9" stroke-width="1"/>
  <text x="480" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Сервис управления графами</text>
  <text x="480" y="425" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Создание, редактирование, визуализация</text>
  
  <rect x="370" y="460" width="220" height="80" rx="5" ry="5" fill="url(#service-gradient)" stroke="#90caf9" stroke-width="1"/>
  <text x="480" y="495" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Сервис генерации тезисов</text>
  <text x="480" y="515" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Создание тезисов на основе графов</text>
  
  <rect x="370" y="550" width="220" height="80" rx="5" ry="5" fill="url(#service-gradient)" stroke="#90caf9" stroke-width="1"/>
  <text x="480" y="585" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Сервис аналитики</text>
  <text x="480" y="605" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Анализ согласованности, противоречий</text>
  
  <rect x="610" y="280" width="220" height="80" rx="5" ry="5" fill="url(#service-gradient)" stroke="#90caf9" stroke-width="1"/>
  <text x="720" y="315" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Сервис кэширования</text>
  <text x="720" y="335" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Временное хранение запросов/ответов</text>
  
  <rect x="610" y="370" width="220" height="80" rx="5" ry="5" fill="url(#service-gradient)" stroke="#90caf9" stroke-width="1"/>
  <text x="720" y="405" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Сервис синтеза концепций</text>
  <text x="720" y="425" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Объединение графов и тезисов</text>
  
  <rect x="610" y="460" width="220" height="80" rx="5" ry="5" fill="url(#service-gradient)" stroke="#90caf9" stroke-width="1"/>
  <text x="720" y="495" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Сервис управления весами</text>
  <text x="720" y="515" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Опциональные количественные хар-ки</text>
  
  <rect x="610" y="550" width="220" height="80" rx="5" ry="5" fill="url(#service-gradient)" stroke="#90caf9" stroke-width="1"/>
  <text x="720" y="585" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">API сервис</text>
  <text x="720" y="605" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">RESTful API для внешнего доступа</text>
  
  <!-- Пользовательский интерфейс -->
  <rect x="500" y="690" width="450" height="60" rx="10" ry="10" fill="url(#ui-gradient)" stroke="#ffb74d" stroke-width="2"/>
  <text x="725" y="725" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Пользовательский интерфейс</text>
  
  <!-- Пользователь -->
  <circle cx="900" y="720" r="30" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
  <text x="900" y="725" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Пользователь</text>
  
  <!-- Связи -->
  <!-- DB к сервисам -->
  <line x1="270" y1="165" x2="370" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="270" y1="245" x2="370" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="270" y1="325" x2="370" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="270" y1="405" x2="370" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="270" y1="485" x2="370" y2="500" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="270" y1="565" x2="610" y2="405" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="270" y1="645" x2="610" y2="405" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Сервисы к Claude -->
  <line x1="480" y1="280" x2="550" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="460" x2="550" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="720" y1="370" x2="650" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Claude к сервисам -->
  <line x1="600" y1="180" x2="480" y2="500" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="180" x2="720" y2="405" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="180" x2="720" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Сервисы к интерфейсу -->
  <line x1="480" y1="630" x2="650" y2="690" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="720" y1="630" x2="700" y2="690" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Интерфейс к пользователю -->
  <line x1="830" y1="720" x2="870" y2="720" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="870" y1="700" x2="830" y2="700" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Легенда -->
  <rect x="850" y="100" width="20" height="20" fill="url(#db-gradient)" stroke="#bbb" stroke-width="1"/>
  <text x="880" y="115" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Базы данных</text>
  
  <rect x="850" y="130" width="20" height="20" fill="url(#service-gradient)" stroke="#90caf9" stroke-width="1"/>
  <text x="880" y="145" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Сервисные модули</text>
  
  <rect x="850" y="160" width="20" height="20" fill="url(#claude-gradient)" stroke="#66bb6a" stroke-width="1"/>
  <text x="880" y="175" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Claude API</text>
  
  <rect x="850" y="190" width="20" height="20" fill="url(#ui-gradient)" stroke="#ffb74d" stroke-width="1"/>
  <text x="880" y="205" font-family="Arial" font-size="12" text-anchor="start" fill="#333">Пользовательский интерфейс</text>
</svg>
