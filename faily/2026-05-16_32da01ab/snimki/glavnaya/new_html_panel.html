  <div class="pg-controls">
    <h2>Illumination filter</h2>

    <div class="pg-preset-row">
      <button class="pg-preset" data-preset="off"     >Без фильтра</button>
      <button class="pg-preset" data-preset="current" >Current (live)</button>
    </div>
    <div class="pg-preset-row">
      <button class="pg-preset" data-preset="v5"     >V5 (мягкий)</button>
      <button class="pg-preset" data-preset="v4"     >V4 (оптимум)</button>
      <button class="pg-preset" data-preset="strong" >Сильный</button>
    </div>
    <div class="pg-preset-row">
      <button class="pg-preset" data-preset="hand"  >Ручной</button>
      <button class="pg-preset" data-preset="aged"  >Выцветший</button>
    </div>

    <div class="pg-mode-row" style="margin:14px 0;padding:10px;background:#1a1a1a;border:1px solid #333;border-radius:3px">
      <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px">
        Способ применения фильтра
      </div>
      <label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;cursor:pointer">
        <input type="radio" name="pg-mode" value="css"/>
        CSS <code>filter: url(#…)</code> на &lt;svg&gt;
      </label>
      <label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;cursor:pointer">
        <input type="radio" name="pg-mode" value="svg" checked/>
        SVG <code>&lt;g filter="…"&gt;</code> обёртка (Firefox-safe)
      </label>
      <label style="display:block;font-size:11px;color:#aaa;cursor:pointer">
        <input type="radio" name="pg-mode" value="root"/>
        SVG <code>filter</code> атрибут на корневом &lt;svg&gt;
      </label>
    </div>

    <div class="pg-mode-row" style="margin:14px 0;padding:10px;background:#1a1a1a;border:1px solid #333;border-radius:3px">
      <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px">
        Firefox diagnostics: тип турбулентности
      </div>
      <label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;cursor:pointer">
        <input type="radio" name="pg-disp-type" value="fractalNoise"/>
        <code>type="fractalNoise"</code>
      </label>
      <label style="display:block;font-size:11px;color:#aaa;cursor:pointer">
        <input type="radio" name="pg-disp-type" value="turbulence" checked/>
        <code>type="turbulence"</code> (Firefox-safe)
      </label>
    </div>

    <div class="pg-mode-row" style="margin:14px 0;padding:10px;background:#1a1a1a;border:1px solid #333;border-radius:3px">
      <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px">
        Firefox diagnostics: color-interpolation-filters
      </div>
      <label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;cursor:pointer">
        <input type="radio" name="pg-cif" value="sRGB"/>
        <code>sRGB</code>
      </label>
      <label style="display:block;font-size:11px;color:#aaa;margin-bottom:4px;cursor:pointer">
        <input type="radio" name="pg-cif" value="linearRGB"/>
        <code>linearRGB</code> (SVG-дефолт)
      </label>
      <label style="display:block;font-size:11px;color:#aaa;cursor:pointer">
        <input type="radio" name="pg-cif" value="auto" checked/>
        <code>auto</code> (Firefox-safe)
      </label>
    </div>

    <h3 style="font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.1em;margin:18px 0 4px;padding-bottom:4px;border-bottom:1px solid #2a2a2a">
      Master parameters
    </h3>
    <div id="pg-control-list"></div>

    <div class="pg-seeds-block">
      <div class="pg-seeds-block-title">Seeds (per-instance)</div>
      <div class="pg-seeds-grid">
        <div></div>
        <div class="pg-seeds-head">disp</div>
        <div class="pg-seeds-head">coarse</div>
        <div class="pg-seeds-head">fine</div>

        <div class="pg-seeds-row-label">Front</div>
        <input type="number" id="seed-front-disp"   min="0" max="200" step="1" value="52"/>
        <input type="number" id="seed-front-coarse" min="0" max="200" step="1" value="42"/>
        <input type="number" id="seed-front-fine"   min="0" max="200" step="1" value="11"/>

        <div class="pg-seeds-row-label">Back</div>
        <input type="number" id="seed-back-disp"   min="0" max="200" step="1" value="71"/>
        <input type="number" id="seed-back-coarse" min="0" max="200" step="1" value="89"/>
        <input type="number" id="seed-back-fine"   min="0" max="200" step="1" value="23"/>

        <div class="pg-seeds-row-label">Initial</div>
        <input type="number" id="seed-initial-disp"   min="0" max="200" step="1" value="113"/>
        <input type="number" id="seed-initial-coarse" min="0" max="200" step="1" value="67"/>
        <input type="number" id="seed-initial-fine"   min="0" max="200" step="1" value="37"/>
      </div>
      <div class="pg-reseed-row">
        <button type="button" class="pg-reseed-btn" id="pg-reseed-all">Reseed all (random)</button>
      </div>
    </div>

    <div class="pg-overrides">
      <div class="pg-overrides-title">Per-instance overrides</div>
      <div id="pg-overrides-container"></div>
    </div>

    <div class="pg-dump">
      <div class="pg-dump-label">Готовая SVG-разметка фильтра</div>
      <pre id="pg-dump-out"></pre>
    </div>
  </div>
